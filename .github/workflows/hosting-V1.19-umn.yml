        @app.post('/api/backups/restore')
        @roles('Owner')
        def backup_restore():
            if running():
                return (jsonify(error='Stop server before restoring'), 400)
            name = str((request.get_json(silent=True) or {}).get('name', ''))
            if Path(name).name != name or not name.endswith('.zip'):
                return (jsonify(error='Invalid backup name'), 400)
            source = BACKUPS / name
            if not source.exists():
                return (jsonify(error='Backup not found'), 404)
            temp = ROOT.parent / 'restore-temp'
            shutil.rmtree(temp, ignore_errors=True)
            temp.mkdir()
            try:
                with zipfile.ZipFile(source) as archive:
                    for member in archive.infolist():
                        target = (temp / member.filename).resolve()
                        if temp.resolve() not in target.parents and target != temp.resolve():
                            raise ValueError('Unsafe backup archive')
                    archive.extractall(temp)
                shutil.rmtree(ROOT)
                temp.rename(ROOT)
                return jsonify(ok=True)
            except Exception as exc:
                shutil.rmtree(temp, ignore_errors=True)
                return (jsonify(error=str(exc)), 400)

