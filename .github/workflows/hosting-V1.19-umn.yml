ckground:linear-gradient(135deg,rgba(35,55,91,.88),rgba(22,31,56,.92));color:#f5f8ff;border-radius:11px;padding:11px 15px;cursor:pointer;font:600 13px inherit;letter-spacing:.01em;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;box-shadow:inset 0 1px rgba(255,255,255,.045)}button:hover{transform:translateY(-2px);border-color:rgba(84,229,255,.62);box-shadow:0 8px 25px rgba(45,180,255,.13),inset 0 1px rgba(255,255,255,.08);background:linear-gradient(135deg,rgba(37,76,112,.95),rgba(39,42,83,.95))}button:active{transform:translateY(0) scale(.985)}nav button{text-align:left;background:transparent;border-color:transparent;color:#aebdd9;padding:12px 14px}nav button:hover{color:white;background:linear-gradient(90deg,rgba(66,190,235,.15),rgba(133,105,255,.10));border-color:rgba(84,229,255,.18);box-shadow:none}\nmain{padding:28px;max-width:1540px;width:100%;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:15px}.card{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,rgba(22,33,59,.84),rgba(12,19,37,.88));border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:16px;box-shadow:var(--shadow);backdrop-filter:none;transition:transform .25s,border-color .25s}.card:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 100% 0%,rgba(84,229,255,.075),transparent 38%)}.card:hover{border-color:rgba(84,229,255,.28)}.big{font-size:27px;font-weight:800;letter-spacing:-.04em;text-shadow:0 0 22px rgba(84,229,255,.12)}.muted{color:var(--muted)}\ninput,select,textarea{background:rgba(5,11,25,.86);color:white;border:1px solid rgba(125,155,220,.25);border-radius:10px;padding:12px;width:100%;margin:5px 0 13px;outline:none;transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(84,229,255,.1)}textarea,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}textarea{min-height:180px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(3,8,19,.9);padding:15px;border-radius:12px;max-height:420px;overflow:auto;border:1px solid rgba(110,145,205,.14);color:#c8dcf5}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.danger{background:linear-gradient(135deg,#782f4c,#421c38)}.success{color:var(--green)}.error{color:#ff8caa}\n.progress{height:12px;background:rgba(67,88,130,.32);border-radius:30px;overflow:hidden;margin:14px 0;border:1px solid rgba(120,150,210,.12)}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--green));background-size:200% 100%;animation:none;transition:width .35s;border-radius:30px;box-shadow:0 0 18px rgba(84,229,255,.3)}@keyframes flow{to{background-position:200% 0}}@keyframes floatGlow{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}.step{display:flex;gap:12px;margin:16px 0;align-items:center}.step button{flex:1}.consolebox{background:rgba(2,7,17,.92);border:1px solid rgba(84,229,255,.17);border-radius:14px;padding:13px;box-shadow:inset 0 0 28px rgba(35,110,160,.07)}#consolelog,#consolelog2{height:360px;max-height:55vh;overflow:auto;margin:0}.log-error{color:#ff718b}.log-warning{color:#ffd477}.log-info{color:#a8c6e8}.diagnostic{border:1px solid var(--line);border-radius:13px;padding:14px;margin:13px 0;background:rgba(8,15,31,.7)}.diagnostic h4{margin:0 0 8px}.diagnostic pre{max-height:150px;color:#ff9baf}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:9px 0}.legend span{font-weight:700}\n.file-toolbar{display:flex;align-items:center;gap:10px;margin:10px 0}.file-list{background:rgba(5,12,26,.72);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-height:120px}.file-entry{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(125,155,220,.12)}.file-entry:last-child{border-bottom:0}.file-entry button{width:100%;text-align:left;background:transparent;border:0;padding:5px}.file-entry button:hover{background:rgba(84,229,255,.08)}.file-size{color:var(--muted);text-align:right;font-size:12px}.file-empty{padding:18px;color:var(--muted)}.addon-list{margin:12px 0}.addon-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid rgba(125,155,220,.12)}.addon-card:last-child{border-bottom:0}.addon-name{overflow-wrap:anywhere;font-weight:700}.addon-meta{color:var(--muted);font-size:12px}.metric .big{margin-top:8px}.metrics-grid .progress{height:9px;margin:12px 0 7px}.metric-note{display:block;color:var(--muted);font-size:12px;min-height:30px}.install-log{height:330px;max-height:45vh;font-size:12px;line-height:1.5;border:1px solid var(--line)}.metric .bar{background:linear-gradient(90deg,var(--cyan),var(--green))}\n#login{background:linear-gradient(145deg,rgba(22,33,59,.94),rgba(8,14,29,.96));border-color:rgba(84,229,255,.25);box-shadow:0 25px 90px rgba(0,0,0,.5),0 0 55px rgba(64,154,255,.08)}#login h2{font-size:27px}#login button{width:100%;background:linear-gradient(100deg,#167da7,#6552c9);border:0;box-shadow:0 8px 25px rgba(74,126,255,.24)}\n@media(max-width:820px){.layout{grid-template-columns:1fr}nav{position:relative;top:0;height:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;border-right:0;border-bottom:1px solid var(--line)}nav button{padding:10px}main{padding:16px}header{padding:15px 17px}}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:13px;border-radius:14px}.big{font-size:22px}.file-entry{grid-template-columns:minmax(0,1fr) 65px 62px;padding:9px;gap:5px}}\n\n/* V1.18: vivid accents with low-cost rendering */\n:root{--pink:#ff63b8;--orange:#ffad5c;--blue:#6d9cff;--lime:#c0f36b;--aqua:#45f0d0}\nbody{background:linear-gradient(145deg,#080b19 0%,#10152c 48%,#17102a 100%)}\nbody:before{display:none}\n.card{backdrop-filter:none;box-shadow:0 7px 20px rgba(0,0,0,.20);transition:border-color .15s}\n.card:nth-child(6n+1){border-top:2px solid var(--cyan)}\n.card:nth-child(6n+2){border-top:2px solid var(--violet)}\n.card:nth-child(6n+3){border-top:2px solid var(--pink)}\n.card:nth-child(6n+4){border-top:2px solid var(--orange)}\n.card:nth-child(6n+5){border-top:2px solid var(--green)}\n.card:nth-child(6n){border-top:2px solid var(--blue)}\nnav{backdrop-filter:none;background:rgba(12,18,38,.96)}\nbutton{box-shadow:none;transition:background-color .12s,border-color .12s}\nbutton:hover{transform:none;box-shadow:none}\n.bar{box-shadow:none;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--orange),var(--green))}\n.metric:nth-child(5n+1) .big{color:var(--cyan)}\n.metric:nth-child(5n+2) .big{color:var(--pink)}\n.metric:nth-child(5n+3) .big{color:var(--orange)}\n.metric:nth-child(5n+4) .big{color:var(--lime)}\n.metric:nth-child(5n) .big{color:var(--blue)}\n@media(max-width:600px){body{background:linear-gradient(160deg,#080b19,#10152b 65%,#17102a)}main{padding:12px}.card{box-shadow:0 4px 12px rgba(0,0,0,.18)}nav{gap:5px}nav button{padding:9px 10px}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}\n</style></head><body>\n<header><h1>⛏ MINECRAFT HOSTING <span class="muted">ULTIMATE / V1.18</span></h1><span class="muted">● CONTROL CENTER</span></header>\n\n<div id="login" class="card" style="max-width:420px;margin:50px auto">\n<h2>Sign in</h2><label>Username</label><input id="username" value="owner">\n<label>Password</label><input id="password" type="password">\n<button onclick="login()">Login</button><p id="loginmsg"></p>\n</div>\n\n<div id="app" class="layout hidden"><nav>\n<button onclick="show(\'overview\')">Overview</button>\n<button onclick="show(\'setup\')">Setup Wizard</button>\n<button onclick="show(\'console\')">Console</button>\n<button onclick="show(\'players\')">Players</button>\n<button onclick="show(\'files\')">File Manager</button>\n<button id="navPlugins" class="hidden" onclick="show(\'plugins\')">Plugins</button>\n<button id="navMods" class="hidden" onclick="show(\'mods\')">Mods</button>\n<button onclick="show(\'backups\')">Backups</button>\n<button onclick="show(\'users\')">Users & Roles</button>\n<button onclick="show(\'monitoring\')">Monitoring</button>\n<button onclick="show(\'settings\')">Settings</button>\n<button onclick="logout()">Logout</button>\n</nav><main>\n\n<section id="overview"><h2>Dashboard</h2>\n<div class="grid">\n<div class="card">Server status<div class="big" id="status">-</div></div>\n<div class="card">Software<div class="big" id="software">-</div></div>\n<div class="card">Minecraft<div class="big" id="version">-</div></div>\n<div class="card">Server CPU<div class="big" id="cpu">-</div><div class="progress"><div class="bar" id="overviewCpuBar"></div></div></div>\n<div class="card">Server RAM<div class="big" id="ram">-</div><div class="progress"><div class="bar" id="overviewRamBar"></div></div></div>\n<div class="card">Server TPS<div class="big" id="overviewTps">-</div><div class="progress"><div class="bar" id="overviewTpsBar"></div></div></div>\n<div class="card">Uptime<div class="big" id="uptime">-</div></div>\n</div>\n<div class="card"><h3>Server controls</h3><div class="row">\n<button onclick="api(\'/api/start\')">▶ Start</button>\n<button onclick="api(\'/api/stop\')">■ Stop</button>\n<button onclick="api(\'/api/restart\')">↻ Restart</button>\n</div></div>\n<div class="card"><h3>Live Console</h3>\n<div class="legend"><span class="log-error">● Errors</span><span class="log-warning">● Warnings</span><span class="log-info">● Info</span></div><div class="consolebox"><pre id="consolelog">Waiting for console...</pre></div><div id="crashdiagnostics" class="diagnostic"><h4>Crash analysis</h4><p>Waiting for log analysis...</p></div>\n<div class="row"><input id="commandInput" placeholder="Minecraft command">\n<button onclick="sendCommand()">Send</button></div>\n<button onclick="refreshConsole()">Refresh now</button>\n</div></section>\n\n<section id="setup" class="hidden"><h2>Setup Wizard</h2>\n<div class="card">\n<div class="step"><span id="stepLabel" class="muted">Step 1 of 5</span><span id="stepName">Minecraft version</span></div>\n<div id="wizard1"><h3>Step 1 — Minecraft version</h3>\n<label>Choose Minecraft version</label><select id="mcversion"></select>\n<p class="muted">Select the game version for your server. Velocity uses this as the target network version.</p>\n<button onclick="nextStep(2)">Next →</button></div>\n<div id="wizard2" class="hidden"><h3>Step 2 — Server software</h3>\n<label>Choose server software</label><select id="softwareSelect" onchange="softwareChanged()">\n<option value="Vanilla">Vanilla</option><option value="Paper">Paper</option>\n<option value="Fabric">Fabric</option><option value="Forge">Forge</option>\n<option value="NeoForge">NeoForge</option><option value="Quilt">Quilt</option><option value="Folia">Folia</option><option value="Arclight">Arclight (hybrid)</option><option value="Velocity">Velocity Proxy</option><option value="BungeeCord">BungeeCord Proxy</option>\n</select>\n<p class="muted" id="softwareDescription">Choose the server platform you want to install.</p>\n<div class="row"><button onclick="nextStep(1)">← Back</button><button onclick="loadLoaderVersions()">Next →</button></div></div>\n<div id="wizard3" class="hidden"><h3>Step 3 — Compatible loader / release</h3>\n<p class="muted" id="loaderDescription">Checking compatible versions...</p>\n<select id="loaderVersion"></select>\n<div class="row"><button onclick="nextStep(2)">← Back</button><button onclick="prepareReview()">Next → RAM</button></div></div>\n<div id="wizard4" class="hidden"><h3>Step 4 — Server RAM allocation</h3>\n<label>Choose the maximum RAM for the Minecraft server</label>\n<select id="memorySelect"><option value="2G">2 GB</option><option value="3G">3 GB</option><option value="4G" selected>4 GB — Recommended</option><option value="5G">5 GB</option><option value="6G">6 GB</option><option value="8G">8 GB</option><option value="10G">10 GB</option><option value="12G">12 GB</option></select>\n<p class="muted">This value controls the Java server maximum heap (-Xmx). Choose according to the available memory on your GitHub Actions runner.</p>\n<div class="row"><button onclick="nextStep(3)">← Back</button><button onclick="prepareFinalReview()">Next → Review</button></div></div>\n<div id="wizard5" class="hidden"><h3>Step 5 — Review and install</h3>\n<div class="card" id="installSummary">Your configuration will appear here.</div>\n<div class="row"><button onclick="nextStep(4)">← Back</button><button onclick="beginInstall()">Install server →</button></div></div>\n<div id="wizardProgress" class="hidden"><h3>Installing server</h3>\n<div class="progress"><div class="bar" id="progressBar"></div></div>\n<div class="big" id="progressPercent">0%</div>\n<p id="progressStage">Preparing...</p><p id="progressError" class="error"></p>\n<h4>Live installer output</h4><pre id="installLog" class="install-log">Waiting for installer output...</pre>\n<button id="finishInstall" class="hidden" onclick="show(\'overview\')">Open dashboard</button>\n</div>\n</div></section>\n\n<section id="console" class="hidden"><h2>Live Console</h2>\n<div class="card"><div class="legend"><span class="log-error">● Errors</span><span class="log-warning">● Warnings</span><span class="log-info">● Info</span></div><div class="consolebox"><pre id="consolelog2"></pre></div><div id="crashdiagnostics2" class="diagnostic"><h4>Crash analysis</h4><p>Waiting for log analysis...</p></div>\n<input id="commandInput2" placeholder="Minecraft command">\n<button onclick="sendCommand2()">Send command</button></div></section>\n\n<section id="players" class="hidden"><h2>Players</h2><div class="card">\n<input id="playername" placeholder="Player name"><div class="row">\n<button onclick="playerAction(\'kick\')">Kick</button>\n<button onclick="playerAction(\'ban\')">Ban</button>\n<button onclick="playerAction(\'pardon\')">Pardon</button>\n<button onclick="playerAction(\'op\')">OP</button>\n<button onclick="playerAction(\'deop\')">Deop</button></div>\n<button onclick="playerAction(\'whitelist_add\')">Whitelist add</button>\n<button onclick="playerAction(\'whitelist_remove\')">Whitelist remove</button>\n</div></section>\n\n<section id="files" class="hidden"><h2>File Manager</h2><div class="card">\n<input id="filePath" placeholder="Relative path, e.g. server.properties">\n<button onclick="browse()">Open / Browse</button><div class="file-toolbar"><button onclick="goParent()">↑ Up</button><button onclick="browse()">↻ Refresh</button><span id="fileCrumb" class="muted">/</span></div><div id="fileList" class="file-list"><p class="muted">Choose a folder to browse files.</p></div>\n<textarea id="fileContent" placeholder="File contents"></textarea>\n<button onclick="saveFile()">Save file</button></div></section>\n\n<section id="plugins" class="hidden"><h2>Plugins</h2><div class="card">\n<input type="file" id="pluginFile"><button onclick="uploadAddon(\'plugins\')">Upload JAR</button>\n<div id="pluginList" class="file-list addon-list"></div><button onclick="listAddons(\'plugins\')">Refresh</button></div></section>\n\n<section id="mods" class="hidden"><h2>Mods</h2><div class="card">\n<input type="file" id="modFile"><button onclick="uploadAddon(\'mods\')">Upload JAR</button>\n<div id="modList" class="file-list addon-list"></div><button onclick="listAddons(\'mods\')">Refresh</button></div></section>\n\n<section id="backups" class="hidden"><h2>Backups</h2><div class="card">\n<button onclick="api(\'/api/backups/create\')">Create backup</button>\n<div id="backupList" class="file-list"></div><button onclick="listBackups()">Refresh</button>\n<input id="restoreName" placeholder="Backup filename">\n<button onclick="restoreBackup()">Restore backup</button></div></section>\n\n<section id="users" class="hidden"><h2>Users & Roles</h2><div class="card">\n<input id="newUsername" placeholder="Username">\n<input id="newPassword" type="password" placeholder="Password (12+ characters)">\n<select id="newRole"><option>Admin</option><option>Moderator</option></select>\n<button onclick="createUser()">Create user</button><div id="userList" class="file-list"></div>\n<button onclick="listUsers()">Refresh</button></div></section>\n\n<section id="monitoring" class="hidden"><h2>Server Monitoring</h2>\n<p class="muted">Live measurements from the Minecraft Java process only · automatic refresh every 2.5 seconds.</p>\n<div class="grid metrics-grid">\n<div class="card metric"><span class="muted">Server CPU</span><div class="big" id="metricCpu">—</div><div class="progress"><div class="bar" id="metricCpuBar"></div></div><small class="metric-note">CPU consumed by the Minecraft process</small></div>\n<div class="card metric"><span class="muted">Server RAM</span><div class="big" id="metricRam">—</div><div class="progress"><div class="bar" id="metricRamBar"></div></div><small class="metric-note">Java process RSS / configured -Xmx (approximate)</small></div>\n<div class="card metric"><span class="muted">Server TPS</span><div class="big" id="metricTps">—</div><div class="progress"><div class="bar" id="metricTpsBar"></div></div><small class="metric-note" id="metricTpsNote">Waiting for server...</small></div>\n<div class="card metric"><span class="muted">Server uptime</span><div class="big" id="metricUptime">—</div></div>\n<div class="card metric"><span class="muted">Server process</span><div class="big" id="metricState">STOPPED</div></div>\n</div>\n<div class="card"><span class="muted">Measurement scope</span><p>These values exclude the host operating system and other processes. When the Minecraft server is stopped, all measurements are suspended and displayed as unavailable.</p></div>\n</section>\n\n<section id="settings" class="hidden"><h2>Settings & Session</h2><div class="card">\n<p>Maximum players: 20</p>\n<button onclick="shutdown()">Shutdown Session</button>\n<button class="danger" onclick="emergency()">Emergency Kill</button>\n<hr><h3>FULL SERVER PURGE</h3>\n<p class="error">Deletes every repository item except files inside .github/workflows. Git history remains intact.</p>\n<input id="purgeText" placeholder="Type PURGE SERVER">\n<button class="danger" onclick="purge()">FULL SERVER PURGE</button>\n</div></section>\n<p id="message"></p></main></div>\n\n<script>let csrf=\'\';\nlet currentFile=\'\';\nlet consoleTimer=null;\nlet dashboardTimer=null;\nlet progressTimer=null;\nlet minecraftLoaded=false;\nlet loaderRequired=false;\n\nasync function readApi(response){\n  const body=await response.text();\n  let data={};\n  try{data=body?JSON.parse(body):{};}\n  catch(e){throw new Error(`Server returned non-JSON response (HTTP ${response.status}): ${body.slice(0,180)}`);}\n  if(!response.ok)throw new Error(data.error||`Request failed (HTTP ${response.status})`);\n  return data;\n}\nasync function call(url,data=null,method=\'POST\'){\n  const options={method,headers:{\'Content-Type\':\'application/json\',\'X-CSRF-Token\':csrf}};\n  if(data!==null)options.body=JSON.stringify(data);\n  return readApi(await fetch(url,options));\n}\nfunction message(t,bad=false){const el=document.getElementById(\'message\');el.textContent=t;el.className=bad?\'error\':\'success\';}\nasync function login(){\n  try{\n    const r=await fetch(\'/api/login\',{method:\'POST\',headers:{\'Content-Type\':\'application/json\'},body:JSON.stringify({username:document.getElementById(\'username\').value,password:document.getElementById(\'password\').value})});\n    const d=await readApi(r);csrf=d.csrf;enterApp();\n  }catch(e){document.getElementById(\'loginmsg\').textContent=e.message;}\n}\nfunction enterApp(){\n  document.getElementById(\'login\').classList.add(\'hidden\');document.getElementById(\'app\').classList.remove(\'hidden\');\n  refreshDashboard();refreshConsole();loadMinecraftVersions();\n  if(dashboardTimer)clearInterval(dashboardTimer);dashboardTimer=setInterval(refreshDashboard,2500);\n  if(consoleTimer)clearInterval(consoleTimer);consoleTimer=setInterval(refreshConsole,4500);\n}\nasync function checkSession(){\n  try{const d=await readApi(await fetch(\'/api/me\'));csrf=d.csrf;enterApp();}\n  catch(e){document.getElementById(\'login\').classList.remove(\'hidden\');}\n}\nasync function logout(){try{await call(\'/api/logout\');}catch(e){}location.reload();}\nfunction show(id){\n  document.querySelectorAll(\'main section\').forEach(x=>x.classList.add(\'hidden\'));\n  document.getElementById(id).classList.remove(\'hidden\');\n  if(id===\'setup\'&&!minecraftLoaded)loadMinecraftVersions();\n  if(id===\'console\')refreshConsole();if(id===\'files\')browse();\n  if(id===\'plugins\'&&addonAllowed(\'plugins\'))listAddons(\'plugins\');if(id===\'mods\'&&addonAllowed(\'mods\'))listAddons(\'mods\');\n  if(id===\'backups\')listBackups();if(id===\'users\')listUsers();\n}\nasync function api(url,data={}){try{const d=await call(url,data);message(d.message||\'Operation completed\');refreshDashboard();}catch(e){message(e.message,true);}}\nfunction addonAllowed(kind){return !document.getElementById(kind===\'plugins\'?\'navPlugins\':\'navMods\').classList.contains(\'hidden\');}\nfunction updateAddonNavigation(categories){\n  document.getElementById(\'navPlugins\').classList.toggle(\'hidden\',!categories.includes(\'plugins\'));\n  document.getElementById(\'navMods\').classList.toggle(\'hidden\',!categories.includes(\'mods\'));\n  if(!categories.includes(\'plugins\')&&document.getElementById(\'plugins\')&&!document.getElementById(\'plugins\').classList.contains(\'hidden\'))show(\'overview\');\n  if(!categories.includes(\'mods\')&&document.getElementById(\'mods\')&&!document.getElementById(\'mods\').classList.contains(\'hidden\'))show(\'overview\');\n}\nfunction renderMetrics(d){\n  const set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};\n  const bar=(id,value)=>{const el=document.getElementById(id);if(el)el.style.width=Math.max(0,Math.min(100,Number(value)||0))+\'%\';};\n  if(!d.running){\n    set(\'metricCpu\',\'—\');set(\'metricRam\',\'—\');set(\'metricTps\',\'—\');\n    set(\'metricTpsNote\',\'Serverul este oprit; măsurătorile sunt suspendate.\');\n    set(\'metricUptime\',\'—\');set(\'metricState\',\'STOPPED\');\n    bar(\'metricCpuBar\',0);bar(\'metricRamBar\',0);bar(\'metricTpsBar\',0);\n    return;\n  }\n  set(\'metricCpu\',d.cpu===null||d.cpu===undefined?\'—\':Number(d.cpu).toFixed(1)+\'%\');\n  bar(\'metricCpuBar\',d.cpu);\n  if(d.ram_used!==null&&d.ram_used!==undefined){\n    set(\'metricRam\',formatMemory(d.ram_used)+\' / \'+formatMemory(d.ram_limit));\n    bar(\'metricRamBar\',d.ram_percent);\n  }else{set(\'metricRam\',\'—\');bar(\'metricRamBar\',0);}\n  if(d.tps!==null&&d.tps!==undefined){\n    set(\'metricTps\',Number(d.tps).toFixed(1)+\' / 20 TPS\');\n    bar(\'metricTpsBar\',Number(d.tps)/20*100);\n    set(\'metricTpsNote\',\'Valoare raportată de comanda TPS a serverului.\');\n  }else{\n    set(\'metricTps\',\'N/A\');bar(\'metricTpsBar\',0);\n    const kind=(d.config&&d.config.type)||\'\';\n    const notes={Fabric:\'TPS necesită Spark instalat ca mod.\',Vanilla:\'Această versiune Vanilla nu a furnizat o valoare TPS.\',Velocity:\'Proxy: nu există TPS de joc pentru acest proces.\',BungeeCord:\'Proxy: nu există TPS de joc pentru acest proces.\'};\n    set(\'metricTpsNote\',notes[kind]||\'Comanda TPS nu a returnat încă o valoare.\');\n  }\n  set(\'metricUptime\',formatDuration(d.uptime));\n  set(\'metricState\',\'RUNNING\');\n}\nfunction formatMemory(gb){gb=Math.max(0,Number(gb)||0);return gb<1?(gb*1024).toFixed(1)+\' MB\':gb.toFixed(2)+\' GB\';}\nfunction formatDuration(seconds){seconds=Math.max(0,Number(seconds)||0);const days=Math.floor(seconds/86400);const hours=Math.floor(seconds%86400/3600);const mins=Math.floor(seconds%3600/60);return (days?days+\'d \':\'\')+hours+\'h \'+mins+\'m\';}\nfunction renderFileCards(target,items,kind){\n  target.replaceChildren();\n  if(!items||!items.length){const empty=document.createElement(\'div\');empty.className=\'file-empty\';empty.textContent=\'No \'+kind+\' found yet.\';target.appendChild(empty);return;}\n  for(const item of items){const card=document.createElement(\'div\');card.className=\'addon-card\';const left=document.createElement(\'div\');const name=document.createElement(\'div\');name.className=\'addon-name\';name.textContent=item.name||item.username||\'Item\';const meta=document.createElement(\'div\');meta.className=\'addon-meta\';meta.textContent=item.role||formatFileSize(item.size||0);left.append(name,meta);card.appendChild(left);target.appendChild(card);}\n}\nasync function refreshDashboard(){\n  if(window.dashboardBusy)return;\n  window.dashboardBusy=true;\n  try{\n    const d=await readApi(await fetch(\'/api/status\'));\n    document.getElementById(\'status\').textContent=d.state===\'starting\'?\'STARTING\':(d.state===\'running\'?\'RUNNING\':\'STOPPED\');\n    document.getElementById(\'software\').textContent=d.config.type||\'-\';\n    document.getElementById(\'version\').textContent=d.config.version||\'-\';\n    const cpuText=d.running&&d.cpu!==null?Number(d.cpu).toFixed(1)+\'%\':\'—\';\n    const ramText=d.running&&d.ram_used!==null?formatMemory(d.ram_used)+\' / \'+formatMemory(d.ram_limit):\'—\';\n    const tpsText=d.state===\'running\'?(d.tps===null||d.tps===undefined?\'N/A\':Number(d.tps).toFixed(1)+\' / 20\'):\'—\';\n    document.getElementById(\'cpu\').textContent=cpuText;\n    document.getElementById(\'ram\').textContent=ramText;\n    document.getElementById(\'overviewTps\').textContent=tpsText;\n    document.getElementById(\'uptime\').textContent=d.running?formatDuration(d.uptime):\'—\';\n    const setBar=(id,value)=>{const el=document.getElementById(id);if(el)el.style.width=Math.max(0,Math.min(100,Number(value)||0))+\'%\';};\n    setBar(\'overviewCpuBar\',d.running?d.cpu:0);\n    setBar(\'overviewRamBar\',d.running?d.ram_percent:0);\n    setBar(\'overviewTpsBar\',d.state===\'running\'&&d.tps!==null?Number(d.tps)/20*100:0);\n    renderMetrics(d);updateAddonNavigation(d.addon_categories||[]);\n  }catch(e){message(e.message,true);}\n  finally{window.dashboardBusy=false;}\n}\nfunction renderConsole(el, text){\n  if(!el)return;\n  if(el.dataset.rawLog===text)return;\n  el.dataset.rawLog=text;\n  const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<35;\n  el.replaceChildren();\n  const lines=(text||\'Waiting for server output...\').split(\'\\n\');\n  let errorContext=false;\n  for(const line of lines){\n    const span=document.createElement(\'span\');\n    const isError=/\\b(ERROR|SEVERE|FATAL|Exception|Error|CRITICAL)\\b|Caused by:|\\bat [\\w.$]+\\(/i.test(line);\n    const isWarning=/\\b(WARN|WARNING)\\b/i.test(line);\n    if(isError){span.className=\'log-error\';errorContext=true;}\n    else if(isWarning){span.className=\'log-warning\';errorContext=false;}\n    else if(errorContext&&/^\\s*(at |\\.\\.\\. |\\||Caused by:)/.test(line)){span.className=\'log-error\';}\n    else{span.className=\'log-info\';if(/\\b(INFO|DEBUG)\\b/.test(line))errorContext=false;}\n    span.textContent=line+\'\\n\';el.appendChild(span);\n  }\n  if(atBottom)el.scrollTop=el.scrollHeight;\n}\nfunction renderDiagnostics(target,d){\n  if(!target)return;\n  target.replaceChildren();\n  if(!d){\n    const h=document.createElement(\'h4\');h.textContent=\'Crash analysis — inactive\';target.appendChild(h);\n    const p=document.createElement(\'p\');p.textContent=\'Nu există raport de crash. Analiza se activează numai după o închidere neașteptată a procesului Minecraft cu un cod de ieșire diferit de zero.\';target.appendChild(p);\n    return;\n  }\n  const h=document.createElement(\'h4\');h.textContent=\'⚠ \'+d.title;target.appendChild(h);\n  const confidence=document.createElement(\'p\');confidence.textContent=\'Încredere: \'+(d.confidence||\'—\');target.appendChild(confidence);\n  const cause=document.createElement(\'p\');cause.textContent=\'Cauză probabilă: \'+(d.cause||\'—\');target.appendChild(cause);\n  const action=document.createElement(\'p\');action.textContent=\'Recomandare: \'+(d.action||\'—\');target.appendChild(action);\n  const exit=document.createElement(\'p\');exit.textContent=\'Exit code: \'+d.exit_code+\' · Durată sesiune: \'+formatDuration(d.runtime_seconds||0);target.appendChild(exit);\n  if(d.evidence&&d.evidence.length){const pre=document.createElement(\'pre\');pre.textContent=d.evidence.join(\'\\n\');target.appendChild(pre);}\n}\nasync function refreshConsole(){\n  const overviewVisible=!document.getElementById(\'overview\').classList.contains(\'hidden\');\n  const consoleVisible=!document.getElementById(\'console\').classList.contains(\'hidden\');\n  if(!overviewVisible&&!consoleVisible)return;\n  try{\n    const d=await readApi(await fetch(\'/api/console\'));\n    if(overviewVisible){renderConsole(document.getElementById(\'consolelog\'),d.log);renderDiagnostics(document.getElementById(\'crashdiagnostics\'),d.diagnostics);}\n    if(consoleVisible){renderConsole(document.getElementById(\'consolelog2\'),d.log);renderDiagnostics(document.getElementById(\'crashdiagnostics2\'),d.diagnostics);}\n  }catch(e){}\n}\nasync function sendCommandFrom(id){try{await call(\'/api/command\',{command:document.getElementById(id).value});document.getElementById(id).value=\'\';refreshConsole();}catch(e){message(e.message,true);}}\nfunction sendCommand(){sendCommandFrom(\'commandInput\')}function sendCommand2(){sendCommandFrom(\'commandInput2\')}\n\nfunction wizardStep(n){\n  for(let i=1;i<=5;i++)document.getElementById(\'wizard\'+i).classList.toggle(\'hidden\',i!==n);\n  document.getElementById(\'wizardProgress\').classList.add(\'hidden\');\n  document.getElementById(\'stepLabel\').textContent=\'Step \'+n+\' of 5\';\n  document.getElementById(\'stepName\').textContent=[\'\',\'Minecraft version\',\'Server software\',\'Compatible loader / release\',\'Server RAM allocation\',\'Review and install\'][n];\n}\nasync function loadMinecraftVersions(){\n  const select=document.getElementById(\'mcversion\');select.innerHTML=\'<option>Loading versions...</option>\';minecraftLoaded=false;\n  try{const d=await readApi(await fetch(\'/api/catalog/minecraft\'));\n    if(!Array.isArray(d.items)||!d.items.length)throw new Error(\'Mojang did not return any release versions\');\n    select.innerHTML=\'\';d.items.forEach(v=>{const o=document.createElement(\'option\');o.value=v.id;o.textContent=v.id;select.appendChild(o);});minecraftLoaded=true;\n  }catch(e){select.innerHTML=\'<option value="">Versions unavailable — retry</option>\';message(\'Could not load Minecraft versions: \'+e.message,true);}\n}\nfunction nextStep(n){\n  if(n===2&&!document.getElementById(\'mcversion\').value){message(\'Choose a Minecraft version first\',true);return;}\n  if(n>=1&&n<=4)wizardStep(n);\n}\nfunction softwareChanged(){\n  const kind=document.getElementById(\'softwareSelect\').value;\n  const descriptions={Vanilla:\'Official Mojang server — no extra loader.\',Paper:\'Optimized Paper server — stable build selected automatically.\',Fabric:\'Lightweight mod loader. Choose a compatible Fabric loader build.\',Forge:\'Forge mod loader. Only compatible builds are shown.\',NeoForge:\'NeoForge mod loader. Only compatible releases are shown.\',Quilt:\'Quilt mod loader. Choose a compatible Quilt Loader release.\',Folia:\'Regionized multithreaded Paper fork. Stable build selected automatically.\',Arclight:\'Hybrid server: supports Bukkit/Paper plugins together with its compatible mod loader build.\',Velocity:\'Modern Minecraft proxy. Choose a stable Velocity release.\',BungeeCord:\'Minecraft proxy. Select a successful BungeeCord CI build.\'};\n  document.getElementById(\'softwareDescription\').textContent=descriptions[kind]||\'\';\n}\nasync function loadLoaderVersions(){\n  const kind=document.getElementById(\'softwareSelect\').value,mc=document.getElementById(\'mcversion\').value;\n  if(!mc){message(\'Choose a Minecraft version first\',true);wizardStep(1);return;}\n  const select=document.getElementById(\'loaderVersion\');select.innerHTML=\'<option>Loading compatible releases...</option>\';\n  document.getElementById(\'loaderDescription\').textContent=\'Checking \'+kind+\' compatibility for Minecraft \'+mc+\'...\';\n  loaderRequired=[\'Fabric\',\'Forge\',\'NeoForge\',\'Velocity\',\'Quilt\',\'Arclight\',\'BungeeCord\'].includes(kind);\n  wizardStep(3);\n  if(!loaderRequired){select.innerHTML=\'<option value="">Not required</option>\';document.getElementById(\'loaderDescription\').textContent=kind===\'Paper\'||kind===\'Folia\'?kind+\' automatically installs the matching stable build for Minecraft \'+mc+\'.\':\'Vanilla uses the official Mojang server JAR.\';return;}\n  try{\n    const endpoint=kind.toLowerCase();const url=\'/api/catalog/\'+endpoint+(kind===\'Velocity\'||kind===\'BungeeCord\'?\'\':\'?minecraft=\'+encodeURIComponent(mc));\n    const d=await readApi(await fetch(url));const items=Array.isArray(d.items)?d.items:[];\n    if(!items.length)throw new Error(\'No compatible \'+kind+\' releases were returned for this selection\');\n    select.innerHTML=\'\';items.forEach(item=>{const id=typeof item===\'string\'?item:item.id;if(!id)return;const o=document.createElement(\'option\');o.value=id;o.textContent=id+(item.stable===false?\' (unstable)\':\'\');select.appendChild(o);});\n    if(!select.options.length)throw new Error(\'The version list contained no usable entries\');\n    document.getElementById(\'loaderDescription\').textContent=kind+\' releases compatible with \'+(kind===\'Velocity\'?\'the proxy installation\':\'Minecraft \'+mc)+\'.\';\n  }catch(e){select.innerHTML=\'<option value="">Could not load compatible releases</option>\';document.getElementById(\'loaderDescription\').textContent=e.message;message(e.message,true);}\n}\nfunction prepareReview(){\n  const kind=document.getElementById(\'softwareSelect\').value,mc=document.getElementById(\'mcversion\').value;\n  const loader=loaderRequired?document.getElementById(\'loaderVersion\').value:\'\';\n  if(loaderRequired&&!loader){message(\'Choose a compatible release before continuing\',true);wizardStep(3);return;}\n  document.getElementById(\'installSummary\').innerHTML=\'<b>Minecraft:</b> \'+mc+\'<br><b>Software:</b> \'+kind+\'<br><b>Loader / release:</b> \'+(loader||\'Not required\')+\'<br><br>Press Install to download and configure the server.\';\n  wizardStep(4);\n}\nfunction prepareFinalReview(){\n  const kind=document.getElementById(\'softwareSelect\').value,mc=document.getElementById(\'mcversion\').value;\n  const loader=loaderRequired?document.getElementById(\'loaderVersion\').value:\'\';\n  const memory=document.getElementById(\'memorySelect\').value;\n  document.getElementById(\'installSummary\').innerHTML=\'<b>Minecraft:</b> \'+mc+\'<br><b>Software:</b> \'+kind+\'<br><b>Loader / release:</b> \'+(loader||\'Not required\')+\'<br><b>Server RAM:</b> \'+memory+\'<br><br>Press Install to download and configure the server.\';\n  wizardStep(5);\n}\nasync function beginInstall(){\n  const kind=document.getElementById(\'softwareSelect\').value;\n  const data={minecraft:document.getElementById(\'mcversion\').value,software:kind,loader:loaderRequired?document.getElementById(\'loaderVersion\').value:\'\',memory:document.getElementById(\'memorySelect\').value};\n  if(!data.minecraft||([\'Fabric\',\'Forge\',\'NeoForge\',\'Velocity\',\'Quilt\',\'Arclight\',\'BungeeCord\'].includes(kind)&&!data.loader)){message(\'Complete all required wizard selections first\',true);return;}\n  try{\n    await call(\'/api/install\',data);\n    for(let i=1;i<=5;i++)document.getElementById(\'wizard\'+i).classList.add(\'hidden\');\n    document.getElementById(\'wizardProgress\').classList.remove(\'hidden\');document.getElementById(\'progressError\').textContent=\'\';\n    document.getElementById(\'finishInstall\').classList.add(\'hidden\');document.getElementById(\'progressBar\').style.width=\'1%\';\n    document.getElementById(\'progressPercent\').textContent=\'1%\';document.getElementById(\'progressStage\').textContent=\'Starting installation...\';document.getElementById(\'installLog\').textContent=\'Connecting to installer...\';\n    if(progressTimer)clearInterval(progressTimer);progressTimer=setInterval(checkInstallProgress,700);checkInstallProgress();\n  }catch(e){message(e.message,true);}\n}\nasync function checkInstallProgress(){\n  try{\n    const d=await readApi(await fetch(\'/api/install/status\'));\n    document.getElementById(\'progressBar\').style.width=d.percent+\'%\';\n    document.getElementById(\'progressPercent\').textContent=d.percent+\'%\';\n    document.getElementById(\'progressStage\').textContent=d.stage||\'Working...\';\n    const log=document.getElementById(\'installLog\');\n    if(log&&Array.isArray(d.logs)){\n      const text=d.logs.join(\'\\n\');\n      if(log.textContent!==text){const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<45;log.textContent=text;if(atBottom)log.scrollTop=log.scrollHeight;}\n    }\n    if(d.error){document.getElementById(\'progressError\').textContent=\'Installation failed: \'+d.error;clearInterval(progressTimer);return;}\n    if(d.done&&d.percent===100){clearInterval(progressTimer);document.getElementById(\'progressStage\').textContent=\'Installation complete!\';document.getElementById(\'finishInstall\').classList.remove(\'hidden\');refreshDashboard();}\n  }catch(e){document.getElementById(\'progressError\').textContent=\'Progress check failed: \'+e.message;}\n}\nfunction formatFileSize(n){if(!n)return \'—\';const u=[\'B\',\'KB\',\'MB\',\'GB\'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++;}return n.toFixed(i?1:0)+\' \'+u[i];}\nfunction goParent(){const p=filePath.value.replace(/\\\\/g,\'/\').replace(/\\/$/,\'\');filePath.value=p.includes(\'/\')?p.slice(0,p.lastIndexOf(\'/\')):\'\';browse();}\nasync function openFileEntry(name,isDir){const base=filePath.value.replace(/\\/$/,\'\');filePath.value=base?base+\'/\'+name:name;await browse();}\nasync function browse(){\n  try{\n    const p=filePath.value.trim().replace(/^\\/+|\\/+$/g,\'\');\n    const d=await readApi(await fetch(\'/api/files?path=\'+encodeURIComponent(p)));\n    currentFile=p;const list=document.getElementById(\'fileList\');list.replaceChildren();\n    document.getElementById(\'fileCrumb\').textContent=\'/\'+p;\n    if(d.type===\'file\'){fileContent.value=d.content;const note=document.createElement(\'p\');note.className=\'file-empty\';note.textContent=\'Opened: \'+p+\' — edit below and press Save file.\';list.appendChild(note);return;}\n    fileContent.value=\'\';\n    if(p){const row=document.createElement(\'div\');row.className=\'file-entry\';const up=document.createElement(\'button\');up.textContent=\'📁 ..\';up.onclick=goParent;row.appendChild(up);list.appendChild(row);}\n    for(const entry of (d.entries||[])){\n      const row=document.createElement(\'div\');row.className=\'file-entry\';\n      const name=document.createElement(\'button\');name.textContent=(entry.directory?\'📁 \':\'📄 \')+entry.name;name.onclick=()=>openFileEntry(entry.name,entry.directory);\n      const size=document.createElement(\'span\');size.className=\'file-size\';size.textContent=entry.directory?\'Folder\':formatFileSize(entry.size);\n      const action=document.createElement(\'button\');action.textContent=entry.directory?\'Open\':\'Edit\';action.onclick=()=>openFileEntry(entry.name,entry.directory);\n      row.append(name,size,action);list.appendChild(row);\n    }\n    if(!(d.entries||[]).length){const empty=document.createElement(\'div\');empty.className=\'file-empty\';empty.textContent=\'This folder is empty.\';list.appendChild(empty);}\n  }catch(e){message(\'File Explorer: \'+e.message,true);}\n}\nasync function saveFile(){\n  try{await call(\'/api/files/save\',{path:currentFile,content:fileContent.value});message(\'File saved\');}\n  catch(e){message(e.message,true);}\n}\nasync function playerAction(action){\n  try{await call(\'/api/player\',{action,name:playername.value});message(\'Player command sent\');}\n  catch(e){message(e.message,true);}\n}\nasync function listAddons(kind){\n  if(!addonAllowed(kind))return;\n  const d=await readApi(await fetch(\'/api/addons?type=\'+kind));\n  renderFileCards(document.getElementById(kind===\'plugins\'?\'pluginList\':\'modList\'),d.files,kind);\n}\nasync function uploadAddon(kind){\n  try{\n    const input=document.getElementById(kind===\'plugins\'?\'pluginFile\':\'modFile\');\n    const file=input.files[0];if(!file)throw new Error(\'Choose a JAR file\');\n    const form=new FormData();form.append(\'file\',file);form.append(\'type\',kind);\n    const r=await fetch(\'/api/addons/upload\',{method:\'POST\',headers:{\'X-CSRF-Token\':csrf},body:form});\n    const d=await readApi(r);\n    message(\'Upload complete\');listAddons(kind);\n  }catch(e){message(e.message,true);}\n}\nasync function listBackups(){\n  const d=await readApi(await fetch(\'/api/backups\'));\n  renderFileCards(document.getElementById(\'backupList\'),d.items.map(x=>({name:x.name,size:x.size})), \'backups\');\n}\nasync function restoreBackup(){\n  if(!confirm(\'Replace server files with this backup?\'))return;\n  try{await call(\'/api/backups/restore\',{name:restoreName.value});message(\'Backup restored\');}\n  catch(e){message(e.message,true);}\n}\nasync function listUsers(){\n  const d=await readApi(await fetch(\'/api/users\'));\n  renderFileCards(document.getElementById(\'userList\'),d.items, \'users\');\n}\nasync function createUser(){\n  try{\n    await call(\'/api/users\',{username:newUsername.value,password:newPassword.value,role:newRole.value});\n    message(\'User created\');listUsers();\n  }catch(e){message(e.message,true);}\n}\nasync function shutdown(){\n  if(confirm(\'Gracefully stop the server and end this session?\'))await api(\'/api/shutdown\');\n}\nasync function emergency(){\n  if(confirm(\'Force kill the server. World saving is NOT guaranteed. Continue?\'))await api(\'/api/emergency\');\n}\nasync function purge(){\n  if(!confirm(\'This permanently deletes hosting data from the current branch. Continue?\'))return;\n  try{await call(\'/api/purge\',{confirmation:purgeText.value});message(\'Purge requested\');}\n  catch(e){message(e.message,true);}\n}\nwindow.addEventListener(\'load\',checkSession);\n</script></body></html>\n'
        if __name__ == '__main__':
            app.run(host='127.0.0.1', port=8080, threaded=True)
        PY
    - name: Start dashboard
      shell: bash
      run: |
        nohup .venv/bin/python app.py > logs/dashboard.log 2>&1 &
        echo $! > runtime/dashboard.pid
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
            echo "Dashboard ready."
            exit 0
          fi
          sleep 2
        done
        cat logs/dashboard.log
        exit 1
    - name: Start Cloudflare Quick Tunnel
      shell: bash
      run: |
        curl -L --fail --retry 3 \
          https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
          -o cloudflared
        chmod +x cloudflared
        nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate \
          > logs/cloudflared.log 2>&1 &
        echo $! > runtime/cloudflared.pid

        URL=""
        for i in $(seq 1 60); do
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' logs/cloudflared.log | head -n 1 || true)
          [ -n "$URL" ] && break
          sleep 2
        done
        if [ -z "$URL" ]; then
          cat logs/cloudflared.log
          exit 1
        fi

        echo "DASHBOARD URL: $URL"
        echo "OWNER PASSWORD: $OWNER_PASSWORD"
        echo "MINECRAFT JAVA SERVER ADDRESS: $MINECRAFT_ADDRESS"
    - name: Hosting session
      shell: bash
      run: |
        END=$(( $(date +%s) + SESSION_MINUTES * 60 ))
        echo "Session active for $SESSION_MINUTES minutes."
        while [ "$(date +%s)" -lt "$END" ]; do
          [ -f runtime/shutdown.flag ] && break
          [ -f runtime/emergency.flag ] && break
          [ -f runtime/purge.flag ] && break
          sleep 5
        done
        echo "Session finished."
    - name: Stop hosting services
      if: always()
      shell: bash
      run: |
        if [ -f runtime/umn-agent.pid ]; then
          touch runtime/umn-stop.flag
          for i in $(seq 1 5); do
            kill -0 "$(cat runtime/umn-agent.pid)" 2>/dev/null || break
            sleep 1
          done
          kill "$(cat runtime/umn-agent.pid)" 2>/dev/null || true
        fi
        if [ -f runtime/server.pid ]; then
          SERVER_PID="$(cat runtime/server.pid)"
          if [[ "$SERVER_PID" =~ ^[0-9]+$ ]]; then
            kill -TERM -- "-$SERVER_PID" 2>/dev/null || true
            for i in $(seq 1 10); do
              kill -0 "$SERVER_PID" 2>/dev/null || break
              sleep 1
            done
            kill -KILL -- "-$SERVER_PID" 2>/dev/null || true
          fi
        fi
        if [ -f runtime/cloudflared.pid ]; then
          kill "$(cat runtime/cloudflared.pid)" 2>/dev/null || true
        fi
        if [ -f runtime/bore.pid ]; then
          BORE_PID="$(cat runtime/bore.pid)"
          if [[ "$BORE_PID" =~ ^[0-9]+$ ]]; then
            kill "$BORE_PID" 2>/dev/null || true
          fi
        fi
        if [ -f runtime/dashboard.pid ]; then
          kill "$(cat runtime/dashboard.pid)" 2>/dev/null || true
        fi
        pkill -f 'cloudflared tunnel' 2>/dev/null || true
        pkill -f 'python app.py' 2>/dev/null || true
    - name: FULL SERVER PURGE
      id: full_purge
      if: always()
      shell: bash
      run: |
        if [ ! -f runtime/purge.flag ]; then
          echo "performed=false" >> "$GITHUB_OUTPUT"
          echo "Purge not requested."
          exit 0
        fi

        echo "performed=true" >> "$GITHUB_OUTPUT"
        touch "$RUNNER_TEMP/minecraft-hosting-full-purge"
        python - <<'PY'
        from pathlib import Path
        import shutil
        root = Path.cwd()
        # Preserve Git metadata, the complete .github folder, README files and LICENSE files.
        for item in list(root.iterdir()):
            upper = item.name.upper()
            if item.name in ('.git', '.github'):
                continue
            if upper.startswith('README') or upper == 'LICENSE' or upper.startswith('LICENSE.'):
                continue
            if item.is_dir() and not item.is_symlink():
                shutil.rmtree(item)
            else:
                item.unlink(missing_ok=True)
        PY

        git config user.name "Minecraft Hosting"
        git config user.email "minecraft-hosting@users.noreply.github.com"
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "FULL SERVER PURGE - preserve README, LICENSE and .github"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        else
          echo "Repository already contains only workflow files."
        fi
    - name: Persist server data
      if: always() && !cancelled()
      shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/minecraft-hosting-full-purge" ]; then
          echo "Full purge performed; skipping normal persistence."
          exit 0
        fi
        if [ -f runtime/purge.flag ]; then
          echo "Purge performed; skipping normal persistence."
          exit 0
        fi
        git config user.name "Minecraft Hosting"
        git config user.email "minecraft-hosting@users.noreply.github.com"
        for path in server-data backups; do
          if [ -e "$path" ]; then
            git add -A -- "$path"
          fi
        done
        if [ -d runtime ]; then
          git add -u -- runtime 2>/dev/null || true
        fi
        [ ! -f runtime/users.json ] || git add -f runtime/users.json
        [ ! -f runtime/server.json ] || git add -f runtime/server.json
        if ! git diff --cached --quiet; then
          git commit -m "Save Minecraft hosting session data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        else
          echo "No session data changes to persist."
        fi
    - name: Export session files
      if: always() && !cancelled() && steps.full_purge.outputs.performed != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-hosting-session
        path: |
          server-data/
          backups/
          logs/
        retention-days: 7
        if-no-files-found: ignore
