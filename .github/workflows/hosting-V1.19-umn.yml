        @app.get('/api/status')
        @logged_in
        def status():
            observe_exit()
            is_running = running()
            is_ready = server_ready() if is_running else False
            cpu = None
            ram_used = None
            ram_limit = None
            ram_percent = None
            tps = None
            if is_running:
                try:
                    global server_psutil
                    if server_psutil is None or server_psutil.pid != process.pid:
                        server_psutil = psutil.Process(process.pid)
                        server_psutil.cpu_percent(interval=None)
                    cpu_count = max(1, psutil.cpu_count(logical=True) or 1)
                    cpu = round(max(0.0, server_psutil.cpu_percent(interval=None) / cpu_count), 1)
                    rss = server_psutil.memory_info().rss
                    ram_used = round(rss / 1024 ** 3, 3)
                    memory_setting = str(cfg.get('memory', '4G')).upper()
                    match = re.fullmatch('([1-9][0-9]*)([GM])', memory_setting)
                    if match:
                        amount = float(match.group(1))
                        ram_limit = amount if match.group(2) == 'G' else amount / 1024
                    else:
                        ram_limit = 4.0
                    ram_percent = round(rss / (ram_limit * 1024 ** 3) * 100, 1) if ram_limit else None
                except (psutil.Error, OSError, ValueError):
                    pass
                if is_ready:
                    tps = update_tps()
            return jsonify(running=is_running, state='running' if is_ready else 'starting' if is_running else 'stopped', installed=cfg.get('installed', False), config=cfg, addon_categories=addon_categories(), cpu=cpu, ram_used=ram_used, ram_limit=ram_limit, ram_percent=ram_percent, tps=tps, tps_command=tps_command(), uptime=int(time.time() - started_at) if is_running and started_at else 0, crash_detected=bool(crash_event and crash_event.get('detected')))

