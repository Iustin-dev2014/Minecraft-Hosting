name: Minecraft Hosting - Ultimate Edition V1.19 (UMN Network + Bore + Colorful Dashboard)
'on':
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Durata sesiunii
        type: choice
        required: true
        default: '300'
        options:
        - '60'
        - '120'
        - '180'
        - '240'
        - '300'
      java_version:
        description: Java
        type: choice
        required: true
        default: '21'
        options:
        - '8'
        - '17'
        - '21'
        - '25'
  workflow_call:
    inputs:
      session_minutes:
        type: string
        required: false
        default: '300'
      java_version:
        type: string
        required: false
        default: '21'
      tailscale_client_id:
        type: string
        required: false
        default: ''
      tailscale_audience:
        type: string
        required: false
        default: ''
permissions:
  contents: write
  id-token: write
concurrency:
  group: minecraft-hosting
  cancel-in-progress: false
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      SERVER_ROOT: server-data
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: UMN - Identify GitHub account, repository and instance
      shell: bash
      env:
        GH_TOKEN: \${{ github.token }}
        UMN_ACCOUNT_LOGIN: \${{ github.repository_owner }}
        UMN_ACCOUNT_ID: \${{ github.repository_owner_id }}
        UMN_ACTOR_LOGIN: \${{ github.actor }}
        UMN_ACTOR_ID: \${{ github.actor_id }}
        UMN_REPOSITORY: \${{ github.repository }}
        UMN_REPOSITORY_ID: \${{ github.repository_id }}
        UMN_WORKFLOW: \${{ github.workflow }}
        UMN_WORKFLOW_REF: \${{ github.workflow_ref }}
        UMN_REF: \${{ github.ref }}
        UMN_SHA: \${{ github.sha }}
        UMN_EVENT_NAME: \${{ github.event_name }}
        UMN_JAVA_VERSION: \${{ inputs.java_version }}
      run: |
        set -euo pipefail
        mkdir -p logs runtime
        if [ -z "$UMN_ACCOUNT_ID" ]; then
          UMN_ACCOUNT_ID="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/users/$UMN_ACCOUNT_LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
        fi
        UMN_INSTANCE_ID="umn-$UMN_REPOSITORY_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        {
          echo "UMN_ACCOUNT_ID=$UMN_ACCOUNT_ID"
          echo "UMN_INSTANCE_ID=$UMN_INSTANCE_ID"
          echo "UMN_ACCOUNT_LOGIN=$UMN_ACCOUNT_LOGIN"
          echo "UMN_ACTOR_LOGIN=$UMN_ACTOR_LOGIN"
          echo "UMN_ACTOR_ID=$UMN_ACTOR_ID"
          echo "UMN_REPOSITORY=$UMN_REPOSITORY"
          echo "UMN_REPOSITORY_ID=$UMN_REPOSITORY_ID"
          echo "UMN_WORKFLOW=$UMN_WORKFLOW"
          echo "UMN_WORKFLOW_REF=$UMN_WORKFLOW_REF"
          echo "UMN_REF=$UMN_REF"
          echo "UMN_SHA=$UMN_SHA"
          echo "UMN_EVENT_NAME=$UMN_EVENT_NAME"
          echo "UMN_JAVA_VERSION=$UMN_JAVA_VERSION"
        } >> "$GITHUB_ENV"
        echo "============================================================"
        echo "UMN NETWORK INSTANCE IDENTIFICATION"
        echo "GitHub account       : $UMN_ACCOUNT_LOGIN"
        echo "GitHub account ID    : $UMN_ACCOUNT_ID"
        echo "Workflow actor       : $UMN_ACTOR_LOGIN"
        echo "Workflow actor ID    : $UMN_ACTOR_ID"
        echo "Repository           : $UMN_REPOSITORY"
        echo "Repository ID        : $UMN_REPOSITORY_ID"
        echo "Instance ID          : $UMN_INSTANCE_ID"
        echo "Workflow             : $UMN_WORKFLOW"
        echo "Workflow run ID      : $GITHUB_RUN_ID"
        echo "Workflow attempt     : $GITHUB_RUN_ATTEMPT"
        echo "Ref / commit         : $UMN_REF / $UMN_SHA"
        echo "Trigger event        : $UMN_EVENT_NAME"
        echo "Java                 : $UMN_JAVA_VERSION"
        echo "============================================================"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl wget jq unzip zip git gnupg
        python -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install flask psutil requests
    - name: UMN - Connect this instance to the private Tailscale network
      if: \${{ (inputs.tailscale_client_id || vars.UMN_TS_INSTANCE_CLIENT_ID) != '' && (inputs.tailscale_audience || vars.UMN_TS_INSTANCE_AUDIENCE) != '' }}
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: \${{ inputs.tailscale_client_id || vars.UMN_TS_INSTANCE_CLIENT_ID }}
        audience: \${{ inputs.tailscale_audience || vars.UMN_TS_INSTANCE_AUDIENCE }}
        tags: tag:umn-instance
        version: latest
    - name: UMN - Explain disabled private registration
      if: \${{ (inputs.tailscale_client_id || vars.UMN_TS_INSTANCE_CLIENT_ID) == '' || (inputs.tailscale_audience || vars.UMN_TS_INSTANCE_AUDIENCE) == '' }}
      shell: bash
      run: |
        echo "::warning::UMN Tailscale OIDC is not configured. Minecraft will continue, but this run cannot register with UMN. See the Admin repository TAILSCALE-SETUP.md."

    - name: Install and start automatic Minecraft TCP tunnel (Bore)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p logs runtime
        BORE_VERSION="v0.6.0"
        BORE_URL="https://github.com/ekzhang/bore/releases/download/${BORE_VERSION}/bore-${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -fL --retry 3 --retry-delay 2 "$BORE_URL" -o /tmp/bore.tar.gz
        echo "e484d1e3acba77169b773f31a5bfb34192d4b660f44a094a658a2522cd2270f7  /tmp/bore.tar.gz" | sha256sum --check
        mkdir -p /tmp/bore-unpack
        tar -xzf /tmp/bore.tar.gz -C /tmp/bore-unpack
        BORE_BIN="$(find /tmp/bore-unpack -type f -name bore -print -quit)"
        if [ -z "$BORE_BIN" ]; then
          echo "The official Bore release did not contain the expected executable."
          find /tmp/bore-unpack -maxdepth 3 -type f -print
          exit 1
        fi
        install -m 0755 "$BORE_BIN" ./bore
        ./bore --version

        # Expose the Minecraft Java TCP port through the public Bore relay.
        nohup ./bore local 25565 --to bore.pub > logs/bore.log 2>&1 &
        echo $! > runtime/bore.pid

        ADDRESS=""
        for i in $(seq 1 60); do
          ADDRESS="$(grep -Eo 'bore\.pub:[0-9]+' logs/bore.log | tail -n 1 || true)"
          if [ -n "$ADDRESS" ]; then break; fi
          if ! kill -0 "$(cat runtime/bore.pid)" 2>/dev/null; then
            echo "Bore exited before publishing the Minecraft address."
            cat logs/bore.log
            exit 1
          fi
          sleep 2
        done
        if [ -z "$ADDRESS" ]; then
          echo "Bore did not publish a TCP address within 120 seconds."
          cat logs/bore.log
          exit 1
        fi

        echo "============================================================"
        echo "MINECRAFT JAVA SERVER ADDRESS: $ADDRESS"
        echo "MINECRAFT_ADDRESS=$ADDRESS" >> "$GITHUB_ENV"
        printf "%s\n" "$ADDRESS" > runtime/minecraft-address.txt
        echo "LOCAL TARGET: 127.0.0.1:25565"
        echo "TUNNEL: Bore TCP relay (no account, token, or manual claim)"
        echo "The public port is temporary and changes on each workflow run."
        echo "============================================================"
    - name: UMN - Register instance and keep background heartbeat active
      if: \${{ (inputs.tailscale_client_id || vars.UMN_TS_INSTANCE_CLIENT_ID) != '' && (inputs.tailscale_audience || vars.UMN_TS_INSTANCE_AUDIENCE) != '' }}
      shell: bash
      env:
        UMN_ACCOUNT_LOGIN: \${{ env.UMN_ACCOUNT_LOGIN }}
        UMN_ACCOUNT_ID: \${{ env.UMN_ACCOUNT_ID }}
        UMN_ACTOR_LOGIN: \${{ env.UMN_ACTOR_LOGIN }}
        UMN_ACTOR_ID: \${{ env.UMN_ACTOR_ID }}
        UMN_REPOSITORY: \${{ env.UMN_REPOSITORY }}
        UMN_REPOSITORY_ID: \${{ env.UMN_REPOSITORY_ID }}
        UMN_INSTANCE_ID: \${{ env.UMN_INSTANCE_ID }}
        UMN_WORKFLOW: \${{ env.UMN_WORKFLOW }}
        UMN_WORKFLOW_REF: \${{ env.UMN_WORKFLOW_REF }}
        UMN_REF: \${{ env.UMN_REF }}
        UMN_SHA: \${{ env.UMN_SHA }}
        UMN_EVENT_NAME: \${{ env.UMN_EVENT_NAME }}
        UMN_JAVA_VERSION: \${{ env.UMN_JAVA_VERSION }}
      run: |
        set -euo pipefail
        rm -f runtime/umn-registered runtime/umn-stop.flag
        tailscale set --hostname="umn-instance-$GITHUB_RUN_ID" || true
        cat > runtime/umn-agent.sh <<'UMN_AGENT'
        #!/usr/bin/env bash
        set +e
        REGISTERED=0
        get_admin_ip() {
          tailscale status --json 2>/dev/null | python3 -c '
        import json,sys
        try:
            data=json.load(sys.stdin)
            peers=data.get("Peer",{})
            for peer in peers.values():
                if str(peer.get("HostName","")).split(".")[0] == "umn-admin":
                    ips=peer.get("TailscaleIPs",[])
                    if ips:
                        print(ips[0]); break
        except Exception:
            pass
        ' 2>/dev/null
        }
        make_payload() {
          UMN_TAILSCALE_IP="$1" UMN_INSTANCE_STATUS="$2" python3 - <<'PY'
        import json, os
        from pathlib import Path
        config={}
        try:
            config=json.loads(Path("runtime/server.json").read_text(encoding="utf-8"))
        except Exception:
            pass
        try:
            address=Path("runtime/minecraft-address.txt").read_text(encoding="utf-8").strip()
        except Exception:
            address=""
        print(json.dumps({
            "instance_id": os.environ.get("UMN_INSTANCE_ID",""),
            "account_login": os.environ.get("UMN_ACCOUNT_LOGIN",""),
            "account_id": os.environ.get("UMN_ACCOUNT_ID",""),
            "repository": os.environ.get("UMN_REPOSITORY",""),
            "repository_id": os.environ.get("UMN_REPOSITORY_ID",""),
            "run_id": os.environ.get("GITHUB_RUN_ID",""),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT",""),
            "actor": os.environ.get("UMN_ACTOR_LOGIN",""),
            "actor_id": os.environ.get("UMN_ACTOR_ID",""),
            "workflow": os.environ.get("UMN_WORKFLOW",""),
            "workflow_ref": os.environ.get("UMN_WORKFLOW_REF",""),
            "ref": os.environ.get("UMN_REF",""),
            "sha": os.environ.get("UMN_SHA",""),
            "event_name": os.environ.get("UMN_EVENT_NAME",""),
            "java_version": os.environ.get("UMN_JAVA_VERSION",""),
            "tailscale_ip": os.environ.get("UMN_TAILSCALE_IP",""),
            "minecraft_address": address,
            "server_software": config.get("type",""),
            "minecraft_version": config.get("version",""),
            "status": os.environ.get("UMN_INSTANCE_STATUS","starting")
        }))
        PY
        }
        cleanup() {
          if [ "$REGISTERED" -eq 1 ]; then
            ADMIN_IP="$(get_admin_ip)"
            TAILSCALE_IP="$(tailscale ip -4 2>/dev/null | head -n 1)"
            if [ -n "$ADMIN_IP" ] && [ -n "$TAILSCALE_IP" ]; then
              PAYLOAD="$(make_payload "$TAILSCALE_IP" "offline")"
              curl -fsS --connect-timeout 2 --max-time 4 -X POST "http://$ADMIN_IP:8787/api/v1/deregister" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null 2>&1 || true
            fi
          fi
        }
        trap cleanup EXIT
        while [ ! -f runtime/umn-stop.flag ]; do
          ADMIN_IP="$(get_admin_ip)"
          TAILSCALE_IP="$(tailscale ip -4 2>/dev/null | head -n 1)"
          if [ -n "$ADMIN_IP" ] && [ -n "$TAILSCALE_IP" ]; then
            if command -v resolvectl >/dev/null 2>&1; then
              resolvectl dns tailscale0 "$ADMIN_IP" >/dev/null 2>&1 || true
              resolvectl domain tailscale0 "~umn.internal" >/dev/null 2>&1 || true
            fi
            STATUS="starting"
            if [ -f runtime/server.pid ]; then
              SERVER_PID="$(cat runtime/server.pid 2>/dev/null)"
              if [[ "$SERVER_PID" =~ ^[0-9]+$ ]] && kill -0 "$SERVER_PID" 2>/dev/null; then
                STATUS="online"
              fi
            fi
            PAYLOAD="$(make_payload "$TAILSCALE_IP" "$STATUS")"
            if [ "$REGISTERED" -eq 0 ]; then
              if curl -fsS --connect-timeout 4 --max-time 8 -X POST "http://$ADMIN_IP:8787/api/v1/register" -H "Content-Type: application/json" -d "$PAYLOAD" > /tmp/umn-register-response.json 2>/dev/null; then
                REGISTERED=1
                touch runtime/umn-registered
                echo "[UMN] Registration successful: $(cat /tmp/umn-register-response.json)"
              else
                echo "[UMN] Admin is not accepting registration yet; retrying in background."
              fi
            else
              if ! curl -fsS --connect-timeout 4 --max-time 8 -X POST "http://$ADMIN_IP:8787/api/v1/heartbeat" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null 2>&1; then
                REGISTERED=0
                rm -f runtime/umn-registered
                echo "[UMN] Admin heartbeat failed; registration will be retried."
              fi
            fi
          else
            echo "[UMN] Admin peer not visible in Tailscale yet; retrying in background."
          fi
          sleep 20
        done
        UMN_AGENT
        chmod 0755 runtime/umn-agent.sh
        nohup bash runtime/umn-agent.sh >> logs/umn-agent.log 2>&1 &
        echo $! > runtime/umn-agent.pid
        for attempt in $(seq 1 12); do
          if [ -f runtime/umn-registered ]; then
            echo "============================================================"
            echo "[UMN] REGISTRATION COMPLETED SUCCESSFULLY"
            echo "[UMN] Instance: $UMN_INSTANCE_ID"
            echo "[UMN] Admin acknowledged this instance."
            echo "[UMN] Continuing Minecraft startup in 2 seconds..."
            echo "============================================================"
            sleep 2
            exit 0
          fi
          sleep 1
        done
        echo "============================================================"
        echo "[UMN] ADMIN IS CURRENTLY OFFLINE OR UNREACHABLE"
        echo "[UMN] Minecraft startup will continue normally."
        echo "[UMN] Background registration retries are active (every 20 seconds)."
        echo "============================================================"

    - name: Restore directories
      run: |
        mkdir -p server-data backups logs runtime
    - name: Generate credentials
      shell: bash
      run: |
        echo "OWNER_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(20))')" >> "$GITHUB_ENV"
        echo "SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
    - name: Generate application
      shell: bash
      run: |-
        cat > app.py <<'PY'
        import os, re, io, json, time, uuid, shutil, zipfile, queue, shlex
        import hashlib, secrets, threading, subprocess, urllib.request, urllib.error, signal
        import urllib.parse, xml.etree.ElementTree as ET
        from pathlib import Path
        from datetime import timedelta, datetime, timezone
        from functools import wraps
        import psutil
        from flask import Flask, request, jsonify, session, render_template_string
        from werkzeug.exceptions import HTTPException
        BASE = Path(__file__).resolve().parent
        ROOT = (BASE / 'server-data').resolve()
        BACKUPS = BASE / 'backups'
        LOGS = BASE / 'logs'
        RUNTIME = BASE / 'runtime'
        for p in (ROOT, BACKUPS, LOGS, RUNTIME):
            p.mkdir(parents=True, exist_ok=True)
        USERS = RUNTIME / 'users.json'
        CONFIG = RUNTIME / 'server.json'
        LOG = LOGS / 'minecraft.log'
        app = Flask(__name__)
        app.secret_key = os.environ['SESSION_SECRET']
        app.config.update(SESSION_COOKIE_HTTPONLY=True, SESSION_COOKIE_SECURE=True, SESSION_COOKIE_SAMESITE='Lax', PERMANENT_SESSION_LIFETIME=timedelta(days=30), SESSION_REFRESH_EACH_REQUEST=True)
        lock = threading.RLock()
        process = None
        server_psutil = None
        server_ready_flag = False
        started_at = None
        run_log_start = 0
        expected_stop = False
        exit_processed = True
        crash_event = None
        last_tps_query = 0.0
        tps_log_offset = 0
        tps_value = None
        tps_updated_at = 0.0
        install_state = {'running': False, 'done': False, 'percent': 0, 'stage': 'Idle', 'error': None, 'result': None, 'logs': []}

        def utc():
            return datetime.now(timezone.utc).isoformat()

        def read_json(path, default):
            try:
                return json.loads(path.read_text())
            except Exception:
                return default

        def write_json(path, value):
            tmp = path.with_suffix('.tmp')
            tmp.write_text(json.dumps(value, indent=2))
            tmp.replace(path)

        def hash_password(password):
            salt = secrets.token_hex(16)
            digest = hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 260000).hex()
            return salt + '$' + digest

        def verify_password(password, stored):
            try:
                salt, digest = stored.split('$', 1)
                candidate = hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 260000).hex()
                return secrets.compare_digest(candidate, digest)
            except Exception:
                return False
        if not USERS.exists():
            write_json(USERS, {'owner': {'password': hash_password(os.environ['OWNER_PASSWORD']), 'role': 'Owner'}})
        cfg = read_json(CONFIG, {'installed': False, 'type': '', 'version': '', 'loader_version': '', 'memory': '4G', 'max_players': 20})

        def safe_path(relative):
            relative = str(relative or '').replace('\\', '/')
            if relative.startswith('/') or '\x00' in relative:
                raise ValueError('Invalid path')
            candidate = ROOT / relative
            current = ROOT
            for part in Path(relative).parts:
                if part in ('', '.', '..'):
                    if part == '..':
                        raise ValueError('Path traversal blocked')
                    continue
                current = current / part
                if current.is_symlink():
                    raise ValueError('Symbolic links are not allowed')
            resolved = candidate.resolve()
            if resolved != ROOT and ROOT not in resolved.parents:
                raise ValueError('Path outside server directory')
            return resolved

        def logged_in(fn):

            @wraps(fn)
            def wrapper(*args, **kwargs):
                if not session.get('username'):
                    return (jsonify(error='Login required'), 401)
                return fn(*args, **kwargs)
            return wrapper

        def roles(*allowed):

            def decorator(fn):

                @wraps(fn)
                def wrapper(*args, **kwargs):
                    if not session.get('username'):
                        return (jsonify(error='Login required'), 401)
                    users = read_json(USERS, {})
                    role = users.get(session['username'], {}).get('role')
                    if role not in allowed:
                        return (jsonify(error='Permission denied'), 403)
                    return fn(*args, **kwargs)
                return wrapper
            return decorator

        @app.before_request
        def csrf_guard():
            if request.method in ('POST', 'PUT', 'PATCH', 'DELETE'):
                if request.endpoint == 'login':
                    return None
                if not session.get('username'):
                    return (jsonify(error='Login required'), 401)
                token = request.headers.get('X-CSRF-Token', '')
                expected = session.get('csrf', '')
                if not expected or not secrets.compare_digest(token, expected):
                    return (jsonify(error='Invalid CSRF token'), 403)

        @app.errorhandler(HTTPException)
        def http_error(error):
            return (jsonify(error=error.description), error.code)

        @app.errorhandler(Exception)
        def unexpected_error(error):
            app.logger.exception('Unhandled dashboard error')
            return (jsonify(error=f'Internal server error: {type(error).__name__}: {error}'), 500)

        def json_url(url, user_agent=None):
            req = urllib.request.Request(url, headers={'User-Agent': user_agent or 'Minecraft-Hosting/1.8 (+https://github.com/)', 'Accept': 'application/json'})
            try:
                with urllib.request.urlopen(req, timeout=45) as response:
                    raw = response.read()
            except urllib.error.HTTPError as exc:
                detail = exc.read(500).decode('utf-8', 'replace').strip()
                raise RuntimeError(f'API HTTP {exc.code} for {url}: {detail or exc.reason}') from exc
            except urllib.error.URLError as exc:
                raise RuntimeError(f'API connection failed for {url}: {exc.reason}') from exc
            try:
                return json.loads(raw)
            except (json.JSONDecodeError, UnicodeDecodeError) as exc:
                sample = raw[:180].decode('utf-8', 'replace')
                raise RuntimeError(f'API returned invalid JSON for {url}: {sample}') from exc

        def install_log(message):
            stamp = datetime.now().strftime('%H:%M:%S')
            logs = install_state.setdefault('logs', [])
            logs.append(f'[{stamp}] {str(message)}')
            if len(logs) > 2000:
                del logs[:-2000]

        def install_update(percent, stage):
            percent = max(0, min(99, int(percent)))
            previous = install_state.get('stage')
            install_state.update(percent=percent, stage=str(stage))
            if stage != previous:
                install_log(f'ETAPĂ: {stage}')

        def download(url, destination, low=10, high=75, stage=None):
            destination = Path(destination)
            destination.parent.mkdir(parents=True, exist_ok=True)
            temporary = destination.with_suffix(destination.suffix + '.part')
            label = stage or f'Downloading {destination.name}'
            install_log(f'URL DESCĂRCARE: {url}')
            install_update(low, f'{label} — conectare la URL')
            req = urllib.request.Request(url, headers={'User-Agent': 'Minecraft-Hosting/1.8 (+https://github.com/)'})
            last_logged = -1
            try:
                with urllib.request.urlopen(req, timeout=300) as response:
                    total = int(response.headers.get('Content-Length', 0))
                    install_log(f"HTTP {getattr(response, 'status', 200)}; Content-Length: {(total if total else 'necunoscut')} bytes")
                    done = 0
                    with open(temporary, 'wb') as output:
                        while True:
                            chunk = response.read(1024 * 256)
                            if not chunk:
                                break
                            output.write(chunk)
                            done += len(chunk)
                            if total:
                                fraction = min(1.0, done / total)
                                pct = int(fraction * 100)
                                overall = low + int(fraction * (high - low))
                                install_state.update(percent=max(0, min(99, overall)), stage=f'{label} — {pct}% ({done / 1048576:.1f} / {total / 1048576:.1f} MB)')
                                if pct >= last_logged + 2 or done >= total:
                                    install_log(f'{label}: {pct}% — {done / 1048576:.2f} / {total / 1048576:.2f} MB')
                                    last_logged = pct
                            else:
                                install_state.update(stage=f'{label} — {done / 1048576:.1f} MB descărcați')
                if not temporary.exists() or temporary.stat().st_size == 0:
                    raise RuntimeError(f'Downloaded file is empty: {url}')
                install_update(high, f'{label} — verificare JAR')
                if not zipfile.is_zipfile(temporary):
                    raise RuntimeError(f'Downloaded response is not a valid JAR/ZIP file (URL: {url})')
                temporary.replace(destination)
                install_log(f'DESCĂRCARE COMPLETĂ: {destination.name} ({destination.stat().st_size / 1048576:.2f} MB)')
            except urllib.error.HTTPError as exc:
                temporary.unlink(missing_ok=True)
                install_log(f'EROARE HTTP {exc.code} la {url}: {exc.reason}')
                raise RuntimeError(f'Download HTTP {exc.code} for {url}: {exc.reason}') from exc
            except urllib.error.URLError as exc:
                temporary.unlink(missing_ok=True)
                install_log(f'EROARE CONEXIUNE la {url}: {exc.reason}')
                raise RuntimeError(f'Download connection failed for {url}: {exc.reason}') from exc
            except Exception as exc:
                temporary.unlink(missing_ok=True)
                install_log(f'EROARE DESCĂRCARE: {type(exc).__name__}: {exc}')
                raise

        def run_installer(command, stage, timeout=900):
            install_update(60, f'{stage} — pornire')
            install_log('EXECUTARE INSTALLER: ' + shlex.join([str(x) for x in command]))
            proc = subprocess.Popen(command, cwd=ROOT, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
            output_queue = queue.Queue()

            def pump_output():
                try:
                    for line in iter(proc.stdout.readline, ''):
                        output_queue.put(line.rstrip('\r\n'))
                finally:
                    output_queue.put(None)
            reader = threading.Thread(target=pump_output, daemon=True)
            reader.start()
            deadline = time.monotonic() + timeout
            finished_stream = False
            tail = []
            while not finished_stream or proc.poll() is None:
                if time.monotonic() > deadline and proc.poll() is None:
                    proc.terminate()
                    try:
                        proc.wait(timeout=8)
                    except subprocess.TimeoutExpired:
                        proc.kill()
                        proc.wait(timeout=5)
                    install_log(f'TIMEOUT: {stage} a depășit {timeout} secunde.')
                    raise RuntimeError(f'{stage} timed out after {timeout} seconds')
                try:
                    line = output_queue.get(timeout=0.25)
                    if line is None:
                        finished_stream = True
                    elif line:
                        tail.append(line)
                        install_log(line)
                        if len(tail) > 80:
                            tail.pop(0)
                except queue.Empty:
                    pass
            code = proc.wait()
            install_log(f'{stage} s-a încheiat cu exit code {code}.')
            if code != 0:
                raise RuntimeError(f'{stage} failed with exit code {code}. Last output: ' + ' | '.join(tail[-12:]))
            return tail

        def minecraft_versions():
            data = json_url('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
            return [{'id': v['id'], 'type': v['type']} for v in data['versions'] if v['type'] == 'release']

        def papermc_json(path):
            data = json_url('https://fill.papermc.io/v3' + path, 'Minecraft-Hosting/1.8 (https://github.com/)')
            if isinstance(data, dict) and data.get('ok') is False:
                raise RuntimeError(data.get('message', 'PaperMC API request failed'))
            return data

        def papermc_versions(project):
            data = papermc_json('/projects/' + project)
            grouped = data.get('versions') if isinstance(data, dict) else None
            if not isinstance(grouped, dict):
                raise RuntimeError(f'PaperMC returned an unexpected version list for {project}')
            versions = []
            for group_versions in grouped.values():
                if isinstance(group_versions, list):
                    versions.extend((str(value) for value in group_versions))
            return list(dict.fromkeys(versions))

        def papermc_stable_download(project, version):
            safe_version = urllib.parse.quote(str(version), safe='')
            builds = papermc_json(f'/projects/{project}/versions/{safe_version}/builds')
            if not isinstance(builds, list):
                raise RuntimeError(f'PaperMC returned an unexpected builds list for {project} {version}')
            for build in builds:
                if not isinstance(build, dict) or build.get('channel') != 'STABLE':
                    continue
                artifact = (build.get('downloads') or {}).get('server:default')
                if artifact and artifact.get('url'):
                    return artifact
            raise RuntimeError(f'No stable {project} build exists for version {version}')

        def download_verified(url, destination, checksum=None, stage='Downloading server JAR'):
            download(url, destination, stage=stage)
            if checksum:
                install_log('Verificare SHA-256 pentru ' + Path(destination).name)
                digest = hashlib.sha256()
                with open(destination, 'rb') as stream:
                    for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                        digest.update(chunk)
                actual = digest.hexdigest().lower()
                if not secrets.compare_digest(actual, str(checksum).lower()):
                    Path(destination).unlink(missing_ok=True)
                    raise RuntimeError('SHA-256 verification failed for downloaded server JAR')
                install_log('SHA-256 valid.')

        def paper_versions():
            return papermc_versions('paper')

        def velocity_versions():
            return [v for v in papermc_versions('velocity') if 'SNAPSHOT' not in v.upper()]

        def fabric_loaders(mc):
            url = 'https://meta.fabricmc.net/v2/versions/loader/' + urllib.parse.quote(mc, safe='')
            data = json_url(url)
            if not isinstance(data, list):
                raise RuntimeError('Fabric Meta returned an unexpected loader list')
            result = []
            for item in data:
                loader = item.get('loader') if isinstance(item, dict) else None
                if isinstance(loader, dict) and loader.get('version'):
                    result.append({'id': str(loader['version']), 'stable': bool(loader.get('stable', False))})
            return result

        def fabric_installers():
            data = json_url('https://meta.fabricmc.net/v2/versions/installer')
            if not isinstance(data, list):
                raise RuntimeError('Fabric Meta returned an unexpected installer list')
            valid = [item for item in data if isinstance(item, dict) and item.get('version')]
            stable = [item for item in valid if item.get('stable') is True]
            return stable or valid

        def forge_versions(mc):
            url = 'https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml'
            req = urllib.request.Request(url, headers={'User-Agent': 'Minecraft-Hosting/1.8'})
            try:
                with urllib.request.urlopen(req, timeout=45) as response:
                    root = ET.fromstring(response.read())
            except urllib.error.HTTPError as exc:
                raise RuntimeError(f'Forge metadata HTTP {exc.code}: {exc.reason}') from exc
            values = [item.text for item in root.findall('.//version') if item.text and item.text.startswith(mc + '-')]
            return list(reversed(values))

        def neoforge_versions(mc):
            match = re.fullmatch('1\\.(\\d+)\\.(\\d+)', mc)
            if not match:
                return []
            prefix = match.group(1) + '.' + match.group(2) + '.'
            url = 'https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml'
            req = urllib.request.Request(url, headers={'User-Agent': 'Minecraft-Hosting/1.8'})
            try:
                with urllib.request.urlopen(req, timeout=45) as response:
                    root = ET.fromstring(response.read())
            except urllib.error.HTTPError as exc:
                raise RuntimeError(f'NeoForge metadata HTTP {exc.code}: {exc.reason}') from exc
            values = [item.text for item in root.findall('.//version') if item.text and item.text.startswith(prefix)]
            return list(reversed(values))

        def quilt_loaders(mc):
            safe = urllib.parse.quote(str(mc), safe='')
            data = json_url(f'https://meta.quiltmc.org/v3/versions/loader/{safe}')
            if not isinstance(data, list):
                raise RuntimeError('Quilt Meta returned an unexpected loader list')
            result = []
            for item in data:
                loader = item.get('loader') if isinstance(item, dict) else None
                if isinstance(loader, dict) and loader.get('version'):
                    result.append({'id': str(loader['version']), 'stable': bool(loader.get('stable', True))})
            return result

        def arclight_builds(mc):
            data = json_url('https://api.github.com/repos/IzzelAliz/Arclight/releases?per_page=100', 'Minecraft-Hosting/1.8 (https://github.com/)')
            if not isinstance(data, list):
                raise RuntimeError('Arclight releases API returned an unexpected response')
            result = []
            for release in data:
                for asset in release.get('assets', []):
                    name = str(asset.get('name', ''))
                    if name.lower().endswith('.jar') and (not any((part in name.lower() for part in ('installer', 'sources', 'javadoc')))) and re.search('(?<![0-9.])' + re.escape(mc) + '(?![0-9.])', name, re.IGNORECASE) and asset.get('browser_download_url'):
                        result.append({'id': name, 'stable': not release.get('prerelease', False)})
            return result

        def bungeecord_builds():
            data = json_url('https://ci.md-5.net/job/BungeeCord/api/json?tree=builds[number,result]{0,20}', 'Minecraft-Hosting/1.8 (https://github.com/)')
            builds = data.get('builds', []) if isinstance(data, dict) else []
            return [{'id': str(item['number']), 'stable': item.get('result') == 'SUCCESS'} for item in builds if item.get('number') and item.get('result') == 'SUCCESS']

        def catalog(kind, mc=None):
            if kind == 'minecraft':
                return minecraft_versions()
            if kind == 'paper':
                if not mc:
                    raise ValueError('Minecraft version is required')
                return [{'id': mc}] if mc in paper_versions() else []
            if kind == 'fabric':
                if not mc:
                    raise ValueError('Minecraft version is required')
                return fabric_loaders(mc)
            if kind == 'forge':
                if not mc:
                    raise ValueError('Minecraft version is required')
                return forge_versions(mc)
            if kind == 'neoforge':
                if not mc:
                    raise ValueError('Minecraft version is required')
                return neoforge_versions(mc)
            if kind == 'velocity':
                return velocity_versions()
            if kind == 'folia':
                if not mc:
                    raise ValueError('Minecraft version is required')
                return [{'id': mc}] if mc in papermc_versions('folia') else []
            if kind == 'quilt':
                if not mc:
                    raise ValueError('Minecraft version is required')
                return quilt_loaders(mc)
            if kind == 'arclight':
                if not mc:
                    raise ValueError('Minecraft version is required')
                return arclight_builds(mc)
            if kind == 'bungeecord':
                return bungeecord_builds()
            raise ValueError('Unknown catalog type')

        def install_vanilla(mc):
            manifest = json_url('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
            entry = next((v for v in manifest['versions'] if v['id'] == mc), None)
            if not entry:
                raise ValueError('Minecraft version not found')
            install_update(5, 'Loading Mojang metadata')
            meta = json_url(entry['url'])
            install_log('METADATA URL Mojang: ' + entry['url'])
            download(meta['downloads']['server']['url'], ROOT / 'server.jar', stage='Downloading official Mojang server.jar')
            return ['-jar', 'server.jar', 'nogui']

        def install_paper(mc):
            versions = paper_versions()
            if mc not in versions:
                raise ValueError('Paper does not support this Minecraft version')
            artifact = papermc_stable_download('paper', mc)
            download_verified(artifact['url'], ROOT / 'server.jar', (artifact.get('checksums') or {}).get('sha256'), 'Downloading Paper server JAR')
            return ['-jar', 'server.jar', 'nogui']

        def install_fabric(mc, loader):
            available = [item['id'] for item in fabric_loaders(mc)]
            if loader not in available:
                raise ValueError(f'Fabric loader {loader} is not available for Minecraft {mc}')
            installers = fabric_installers()
            if not installers:
                raise RuntimeError('Fabric Meta did not provide any installer versions')
            installer = installers[0]['version']
            url = f"https://meta.fabricmc.net/v2/versions/loader/{urllib.parse.quote(mc, safe='')}/{urllib.parse.quote(loader, safe='')}/{urllib.parse.quote(installer, safe='')}/server/jar"
            download(url, ROOT / 'server.jar', stage='Downloading Fabric server JAR')
            return ['-jar', 'server.jar', 'nogui']

        def install_forge(mc, loader):
            available = forge_versions(mc)
            if loader not in available:
                raise ValueError('Forge version is not available for this Minecraft version')
            full = loader if loader.startswith(mc + '-') else f'{mc}-{loader}'
            url = f'https://maven.minecraftforge.net/net/minecraftforge/forge/{full}/forge-{full}-installer.jar'
            installer = ROOT / 'forge-installer.jar'
            download(url, installer, 10, 55, 'Downloading Forge installer JAR')
            run_installer(['java', '-jar', str(installer), '--installServer'], 'Forge server installer', 900)
            args = ROOT / 'libraries' / 'net' / 'minecraftforge' / 'forge' / full / 'unix_args.txt'
            if not args.exists():
                raise RuntimeError('Forge installer completed but unix_args.txt was not found')
            return ['@' + str(args), 'nogui']

        def install_neoforge(mc, loader):
            if loader not in neoforge_versions(mc):
                raise ValueError('NeoForge version is not available for this Minecraft version')
            installer = ROOT / 'neoforge-installer.jar'
            url = f'https://maven.neoforged.net/releases/net/neoforged/neoforge/{loader}/neoforge-{loader}-installer.jar'
            download(url, installer, 10, 55, 'Downloading NeoForge installer JAR')
            run_installer(['java', '-jar', str(installer), '--install-server'], 'NeoForge server installer', 900)
            args = ROOT / 'libraries' / 'net' / 'neoforged' / 'neoforge' / loader / 'unix_args.txt'
            if not args.exists():
                candidates = list(ROOT.glob('libraries/net/neoforged/neoforge/**/unix_args.txt'))
                if candidates:
                    args = candidates[-1]
            if not args.exists():
                raise RuntimeError('NeoForge installer completed but unix_args.txt was not found')
            return ['@' + str(args), 'nogui']

        def install_velocity(version):
            versions = velocity_versions()
            if version not in versions:
                raise ValueError(f'Velocity release {version} is not available')
            artifact = papermc_stable_download('velocity', version)
            download_verified(artifact['url'], ROOT / 'server.jar', (artifact.get('checksums') or {}).get('sha256'), 'Downloading Velocity proxy JAR')
            return ['-jar', 'server.jar']

        def install_folia(mc):
            versions = papermc_versions('folia')
            if mc not in versions:
                raise ValueError('Folia does not support this Minecraft version')
            artifact = papermc_stable_download('folia', mc)
            download_verified(artifact['url'], ROOT / 'server.jar', (artifact.get('checksums') or {}).get('sha256'), 'Downloading Folia server JAR')
            return ['-jar', 'server.jar', 'nogui']

        def install_quilt(mc, loader):
            available = [item['id'] for item in quilt_loaders(mc)]
            if loader not in available:
                raise ValueError(f'Quilt loader {loader} is not available for Minecraft {mc}')
            versions = json_url('https://meta.quiltmc.org/v3/versions/installer')
            if not isinstance(versions, list) or not versions:
                raise RuntimeError('Quilt Meta did not provide installer versions')
            stable = [v for v in versions if isinstance(v, dict) and v.get('version') and v.get('stable', True)]
            installer_version = str((stable or versions)[0].get('version'))
            installer = ROOT / 'quilt-installer.jar'
            url = f"https://maven.quiltmc.org/repository/release/org/quiltmc/quilt-installer/{urllib.parse.quote(installer_version, safe='')}/quilt-installer-{urllib.parse.quote(installer_version, safe='')}.jar"
            download(url, installer, 10, 45, 'Downloading Quilt installer JAR')
            install_update(60, 'Installing Quilt server and downloading Minecraft server')
            subprocess.run(['java', '-jar', str(installer), 'install', 'server', mc, loader, '--download-server', '--install-dir="."'], cwd=ROOT, check=True, timeout=900)
            launch = ROOT / 'quilt-server-launch.jar'
            if not launch.exists():
                candidates = list(ROOT.glob('**/quilt-server-launch.jar'))
                if candidates:
                    launch = candidates[0]
            if not launch.exists():
                raise RuntimeError('Quilt installer finished but quilt-server-launch.jar was not found')
            if launch.parent != ROOT:
                target = ROOT / 'quilt-server-launch.jar'
                shutil.copy2(launch, target)
            return ['-jar', 'quilt-server-launch.jar', 'nogui']

        def install_arclight(mc, asset_name):
            builds = arclight_builds(mc)
            if asset_name not in [item['id'] for item in builds]:
                raise ValueError('Selected Arclight build is no longer available for this Minecraft version')
            data = json_url('https://api.github.com/repos/IzzelAliz/Arclight/releases?per_page=100', 'Minecraft-Hosting/1.8 (https://github.com/)')
            asset = next((a for r in data for a in r.get('assets', []) if a.get('name') == asset_name), None)
            if not asset or not asset.get('browser_download_url'):
                raise RuntimeError('Arclight release asset could not be resolved')
            destination = ROOT / 'server.jar'
            download(asset['browser_download_url'], destination, 10, 75, 'Downloading Arclight server JAR')
            return ['-jar', 'server.jar', 'nogui']

        def install_bungeecord(build_number):
            if build_number not in [item['id'] for item in bungeecord_builds()]:
                raise ValueError('Selected BungeeCord build is no longer available')
            data = json_url(f"https://ci.md-5.net/job/BungeeCord/{urllib.parse.quote(str(build_number), safe='')}/api/json?tree=number,result,artifacts[fileName,relativePath]", 'Minecraft-Hosting/1.8 (https://github.com/)')
            artifacts = data.get('artifacts', []) if isinstance(data, dict) else []
            artifact = next((a for a in artifacts if str(a.get('fileName', '')).lower().endswith('.jar') and a.get('relativePath')), None)
            if not artifact:
                raise RuntimeError('BungeeCord build has no downloadable JAR artifact')
            url = 'https://ci.md-5.net/job/BungeeCord/' + str(build_number) + '/artifact/' + urllib.parse.quote(artifact['relativePath'], safe='/')
            download(url, ROOT / 'BungeeCord.jar', 10, 75, 'Downloading BungeeCord proxy JAR')
            return ['-jar', 'BungeeCord.jar']

        def install_worker(data):
            global cfg
            try:
                install_state.update(running=True, done=False, percent=1, stage='Preparing installation', error=None, result=None, logs=[])
                install_log('Începere instalare Minecraft Hosting.')
                mc = str(data.get('minecraft', '')).strip()
                kind = str(data.get('software', '')).strip()
                loader = str(data.get('loader', '')).strip()
                memory = str(data.get('memory', '4G')).upper().strip()
                if memory not in ('2G', '3G', '4G', '5G', '6G', '8G', '10G', '12G'):
                    raise ValueError('Choose a supported RAM allocation')
                if not re.fullmatch('[0-9A-Za-z._-]+', mc):
                    raise ValueError('Select a valid Minecraft version')
                if kind not in ('Vanilla', 'Paper', 'Fabric', 'Forge', 'NeoForge', 'Velocity', 'Folia', 'Quilt', 'Arclight', 'BungeeCord'):
                    raise ValueError('Unsupported server software')
                if kind in ('Fabric', 'Forge', 'NeoForge', 'Velocity', 'Quilt', 'Arclight', 'BungeeCord') and (not loader):
                    raise ValueError(f'Select a valid {kind} version')
                ROOT.mkdir(parents=True, exist_ok=True)
                install_log(f"Configurație: software={kind}; Minecraft={mc}; loader/release={loader or 'N/A'}")
                install_update(3, 'Preparing server directory')
                if kind == 'Vanilla':
                    command = install_vanilla(mc)
                elif kind == 'Paper':
                    command = install_paper(mc)
                    loader = ''
                elif kind == 'Fabric':
                    command = install_fabric(mc, loader)
                elif kind == 'Forge':
                    command = install_forge(mc, loader)
                elif kind == 'NeoForge':
                    command = install_neoforge(mc, loader)
                elif kind == 'Velocity':
                    command = install_velocity(loader)
                elif kind == 'Folia':
                    command = install_folia(mc)
                    loader = ''
                elif kind == 'Quilt':
                    command = install_quilt(mc, loader)
                elif kind == 'Arclight':
                    command = install_arclight(mc, loader)
                else:
                    command = install_bungeecord(loader)
                install_update(82, 'Creating server configuration')
                if kind not in ('Velocity', 'BungeeCord'):
                    (ROOT / 'eula.txt').write_text('eula=true\n')
                    props = ROOT / 'server.properties'
                    if not props.exists():
                        props.write_text('server-port=25565\nmax-players=20\nmotd=Ultimate Minecraft Hosting\nonline-mode=true\n')
                else:
                    (ROOT / 'config.yml').touch(exist_ok=True)
                cfg.update({'installed': True, 'type': kind, 'version': mc, 'loader_version': loader, 'memory': memory, 'command': command, 'installed_at': utc(), 'max_players': 20})
                write_json(CONFIG, cfg)
                install_update(95, 'Finalizing installation')
                install_log('Comanda de pornire configurată: ' + shlex.join([str(x) for x in command]))
                install_log('Instalarea s-a încheiat cu succes.')
                install_state.update(running=False, done=True, percent=100, stage='Installation complete', error=None, result={'software': kind, 'minecraft': mc, 'loader': loader})
            except Exception as exc:
                app.logger.exception('Minecraft server installation failed')
                install_log(f'INSTALARE EȘUATĂ: {type(exc).__name__}: {exc}')
                install_state.update(running=False, done=True, stage='Installation failed', error=str(exc))

        def start_server():
            global process, server_psutil, server_ready_flag, started_at, run_log_start, expected_stop, exit_processed
            global crash_event, last_tps_query, tps_log_offset, tps_value, tps_updated_at
            with lock:
                if process and process.poll() is None:
                    return (False, 'Server is already running')
                observe_exit()
                if not cfg.get('installed'):
                    return (False, 'Install a server first')
                command = cfg.get('command') or ['-jar', 'server.jar', 'nogui']
                memory = str(cfg.get('memory', '4G')).upper()
                if memory not in ('2G', '3G', '4G', '5G', '6G', '8G', '10G', '12G'):
                    memory = '4G'
                args = ['java', '-Xms1G', '-Xmx' + memory] + command
                handle = open(LOG, 'a', buffering=1)
                run_log_start = LOG.stat().st_size if LOG.exists() else 0
                process = subprocess.Popen(args, cwd=ROOT, stdin=subprocess.PIPE, stdout=handle, stderr=subprocess.STDOUT, text=True, start_new_session=True)
                handle.close()
                (RUNTIME / 'server.pid').write_text(str(process.pid))
                started_at = time.time()
                server_ready_flag = False
                try:
                    server_psutil = psutil.Process(process.pid)
                    server_psutil.cpu_percent(interval=None)
                except (psutil.Error, OSError):
                    server_psutil = None
                expected_stop = False
                exit_processed = False
                crash_event = None
                last_tps_query = 0.0
                tps_log_offset = run_log_start
                tps_value = None
                tps_updated_at = 0.0
                return (True, 'Server starting')

        def running():
            return process is not None and process.poll() is None

        def server_ready():
            global server_ready_flag
            if not running():
                return False
            if server_ready_flag:
                return True
            if not LOG.exists():
                return False
            try:
                with open(LOG, 'rb') as stream:
                    stream.seek(min(run_log_start, LOG.stat().st_size))
                    stream.seek(max(run_log_start, LOG.stat().st_size - 131072))
                    tail = stream.read().decode('utf-8', 'replace')
            except OSError:
                return False
            kind = str(cfg.get('type', '')).lower()
            if kind in ('velocity', 'bungeecord'):
                patterns = ('\\bDone \\([^)]+\\)!', '\\bListening on\\b', '\\bEnabled BungeeCord version\\b')
            else:
                patterns = ('\\bDone \\([^)]+\\)!', '\\bFor help, type [\\\'\\"]help[\\\'\\"]', '\\bServer started\\b')
            if any((re.search(pattern, tail, re.I) for pattern in patterns)):
                server_ready_flag = True
            return server_ready_flag

        def observe_exit():
            global exit_processed, crash_event
            if process is None or started_at is None or exit_processed:
                return
            code = process.poll()
            if code is None:
                return
            exit_processed = True
            (RUNTIME / 'server.pid').unlink(missing_ok=True)
            if not expected_stop and code != 0:
                crash_event = {'detected': True, 'exit_code': code, 'time': utc(), 'started_at': started_at, 'duration': max(0, int(time.time() - started_at))}
            else:
                crash_event = None

        def send_command(command):
            if not running():
                raise RuntimeError('Server is not running')
            if '\n' in command or '\r' in command:
                raise ValueError('Invalid command')
            process.stdin.write(command + '\n')
            process.stdin.flush()

        def stop_server(force=False):
            global expected_stop
            with lock:
                if not running():
                    observe_exit()
                    (RUNTIME / 'server.pid').unlink(missing_ok=True)
                    return
                expected_stop = True
                try:
                    if force:
                        os.killpg(process.pid, signal.SIGKILL)
                    else:
                        send_command('stop')
                        process.wait(timeout=60)
                except Exception:
                    try:
                        os.killpg(process.pid, signal.SIGTERM)
                        process.wait(timeout=10)
                    except Exception:
                        try:
                            os.killpg(process.pid, signal.SIGKILL)
                            process.wait(timeout=5)
                        except Exception:
                            pass
                finally:
                    observe_exit()
                    (RUNTIME / 'server.pid').unlink(missing_ok=True)

        def log_tail(lines=350):
            if not LOG.exists():
                return ''
            return '\n'.join(LOG.read_text(errors='replace').splitlines()[-lines:])

        def diagnose_crash():
            if not crash_event or not crash_event.get('detected'):
                return None
            log_lines = current_run_log_lines()
            report_lines = crash_report_lines()
            sources = log_lines + report_lines
            joined = '\n'.join(sources)
            checks = [('OutOfMemoryError|Java heap space|GC overhead limit exceeded|unable to create native thread', 'Memorie insuficientă (OOM)', 'Procesul Java a rămas fără memorie heap, memorie nativă sau resurse pentru thread-uri.', 'Verifică limita -Xmx, memoria disponibilă a runnerului și modurile/pluginurile care consumă mult. Dacă eroarea este native-thread, redu thread-urile și încărcarea.'), ('UnsupportedClassVersionError|class file version .* is not supported|compiled by a more recent version of the Java Runtime', 'Versiune Java incompatibilă', 'Un JAR a fost compilat pentru o versiune Java mai nouă sau diferită de runtime-ul folosit.', 'Folosește versiunea Java cerută de versiunea Minecraft și de loader. Verifică și cerințele modurilor/pluginurilor.'), ('Mixin apply failed|MixinTransformerError|InjectionError|Critical injection failure|Mixin.*failed', 'Conflict de Mixin / mod incompatibil', 'Un Mixin nu a putut modifica o clasă țintă; de regulă există o incompatibilitate între moduri, loader sau versiuni.', 'Verifică numele modului din liniile de context, aliniază versiunile pentru aceeași versiune Minecraft și elimină temporar ultimul mod adăugat.'), ('ModLoadingException|Failed to load mods|Errors during loading|Missing or unsupported mandatory dependencies|MissingModsException', 'Mod lipsă, incompatibil sau dependență absentă', 'Loaderul a oprit pornirea deoarece un mod este incompatibil ori îi lipsește o dependență obligatorie.', 'Folosește Failure message / Mod File din raport pentru a identifica exact modurile și instalează dependențele cerute.'), ('NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError', 'Clasă, metodă sau bibliotecă incompatibilă', 'Un mod/plugin caută o clasă, metodă sau bibliotecă absentă din combinația instalată.', 'Actualizează sau revino la versiunea compatibilă a modului/pluginului și verifică dependențele sale.'), ('InvalidPluginException|Could not load plugin|Error loading plugin|Plugin .* generated an exception', 'Plugin defect sau incompatibil', 'Un plugin nu s-a putut încărca ori a produs o excepție în timpul inițializării.', 'Identifică pluginul din mesaj, verifică versiunea sa pentru serverul curent și actualizează dependențele.'), ('Address already in use|Failed to bind to port|Could not bind .*port|BindException', 'Port deja utilizat', 'Serverul nu a putut deschide portul de rețea configurat.', 'Verifică portul configurat și oprește procesul care îl ocupă sau schimbă portul serverului.'), ('Watchdog|A single server tick took|The server has stopped responding|Can.t keep up', 'Server blocat / tick-uri prea lente', 'Watchdog-ul a detectat un tick extrem de lent sau un server care nu mai răspunde.', 'Verifică operația și pluginul/modul activ în momentul blocării; redu încărcarea lumii și analizează CPU-ul serverului.'), ('Corrupt.*(chunk|region|NBT)|Failed to read chunk|Anvil.*corrupt|Exception reading.*region', 'Posibilă corupere a lumii', 'Logul indică o problemă la citirea datelor de chunk, region sau NBT.', 'Nu șterge lumea. Păstrează fișierele și restaurează un backup sănătos înainte de alte încercări.'), ('AccessDeniedException|Permission denied|Operation not permitted', 'Acces refuzat la fișiere', 'Procesul Java nu a putut citi sau scrie într-un fișier sau director necesar.', 'Verifică permisiunile și dacă fișierul sau directorul nu este read-only ori blocat.'), ('StackOverflowError|EXCEPTION_ACCESS_VIOLATION|A fatal error has been detected by the Java Runtime Environment|SIGSEGV', 'Eroare fatală JVM / stack overflow', 'JVM sau un thread Java a întâmpinat o eroare fatală, posibil cauzată de cod nativ ori recursie excesivă.', 'Verifică fișierul hs_err_pid, versiunile Java și modurile/pluginurile încărcate înainte de închidere.')]
            match = next((item for item in checks if re.search(item[0], joined, re.I)), None)
            root_causes = [line.strip() for line in sources if re.search('Caused by:', line, re.I)]
            failure_lines = [line.strip() for line in sources if re.search('Failure message:|Mod File:|Description:|Exception in thread|FATAL|Fatal error', line, re.I)]
            evidence = []
            if root_causes:
                evidence.extend(root_causes[-3:])
            if failure_lines:
                evidence.extend(failure_lines[-5:])
            if not evidence:
                evidence.extend([line.strip() for line in sources if re.search('ERROR|SEVERE|FATAL|Exception|Error|crash', line, re.I)][-8:])
            evidence = list(dict.fromkeys(evidence))[-8:]
            if match:
                title, cause, action = (match[1], match[2], match[3])
                confidence = 'Ridicată' if root_causes or report_lines else 'Medie'
            else:
                title = 'Oprire neașteptată — cauză neconfirmată'
                cause = f"Procesul serverului s-a închis neașteptat cu exit code {crash_event.get('exit_code')}. Logurile disponibile nu conțin o semnătură suficientă pentru a atribui cauza cu certitudine."
                if root_causes:
                    cause += ' Ultima cauză explicită din log: ' + root_causes[-1]
                action = 'Verifică dovezile atașate și liniile imediat anterioare opririi. Nu elimina moduri, pluginuri sau fișiere de lume fără backup.'
                confidence = 'Scăzută'
            return {'detected': True, 'title': title, 'confidence': confidence, 'cause': cause, 'action': action, 'evidence': evidence, 'exit_code': crash_event.get('exit_code'), 'crash_time': crash_event.get('time'), 'runtime_seconds': crash_event.get('duration')}

        def current_run_log_lines():
            if not LOG.exists():
                return []
            try:
                with open(LOG, 'rb') as stream:
                    stream.seek(min(run_log_start, LOG.stat().st_size))
                    data = stream.read()
                return data.decode('utf-8', 'replace').splitlines()[-1800:]
            except OSError:
                return []

        def crash_report_lines():
            reports = ROOT / 'crash-reports'
            if not reports.exists():
                return []
            cutoff = (started_at or 0) - 3
            files = sorted((p for p in reports.glob('*.txt') if p.stat().st_mtime >= cutoff), key=lambda p: p.stat().st_mtime, reverse=True)
            if not files:
                return []
            try:
                return files[0].read_text(errors='replace').splitlines()[-800:]
            except OSError:
                return []

        def tps_command():
            kind = str(cfg.get('type', '')).lower()
            if kind in ('paper', 'folia', 'arclight'):
                return 'tps'
            if kind == 'forge':
                return 'forge tps'
            if kind == 'neoforge':
                return 'neoforge tps'
            if kind == 'fabric':
                mods = ROOT / 'mods'
                if mods.exists() and any((p.is_file() and p.suffix.lower() == '.jar' and ('spark' in p.name.lower()) for p in mods.glob('*.jar'))):
                    return 'spark tps'
            return None

        def update_tps():
            global last_tps_query, tps_log_offset, tps_value, tps_updated_at
            if not running() or not server_ready():
                return None
            now = time.time()
            if tps_updated_at and now - tps_updated_at > 30:
                tps_value = None
            if now - last_tps_query >= 10:
                command = tps_command()
                if command:
                    tps_log_offset = LOG.stat().st_size if LOG.exists() else 0
                    try:
                        send_command(command)
                        install_log(f'TPS probe trimis: {command}') if install_state.get('running') else None
                    except Exception:
                        pass
                last_tps_query = now
            if LOG.exists():
                try:
                    with open(LOG, 'rb') as stream:
                        stream.seek(min(tps_log_offset, LOG.stat().st_size))
                        fresh = stream.read().decode('utf-8', 'replace')
                    patterns = ['current tick rate is\\s*([0-9]+(?:\\.[0-9]+)?)', 'tick rate\\s*[:=]\\s*([0-9]+(?:\\.[0-9]+)?)', 'TPS from last 1m[^:]*:\\s*([0-9]+(?:\\.[0-9]+)?)', 'TPS\\s*\\(1m[^)]*\\)\\s*:\\s*([0-9]+(?:\\.[0-9]+)?)', 'Mean TPS\\s*:\\s*([0-9]+(?:\\.[0-9]+)?)', 'Average TPS\\s*:\\s*([0-9]+(?:\\.[0-9]+)?)', 'Overall TPS\\s*:\\s*([0-9]+(?:\\.[0-9]+)?)']
                    for pattern in patterns:
                        found = re.search(pattern, fresh, re.I)
                        if found:
                            tps_value = max(0.0, min(20.0, float(found.group(1))))
                            tps_updated_at = now
                            break
                except OSError:
                    pass
            return tps_value

        def make_backup():
            if running():
                raise RuntimeError('Stop the server before backing up')
            name = 'backup-' + datetime.now().strftime('%Y%m%d-%H%M%S') + '.zip'
            target = BACKUPS / name
            with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as z:
                for item in ROOT.rglob('*'):
                    if item.is_file():
                        z.write(item, item.relative_to(ROOT))
            return name

